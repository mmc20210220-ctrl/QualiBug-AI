version: "3.9"

services:
  qualibug:
    build:
      context: .
      dockerfile: Dockerfile
    image: qualibug-ai:95.0.0-private-pilot
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      QUALIBUG_PROJECT: default
      QUALIBUG_PORT: "8088"
      QUALIBUG_BIND_HOST: "0.0.0.0"
      QUALIBUG_ALLOW_PUBLIC_BIND: "1"
      QUALIBUG_PRIVATE_ROOT: /app
      # Both secrets are fail-closed: compose refuses to start without them.
      QUALIBUG_JWT_SECRET: ${QUALIBUG_JWT_SECRET:?QUALIBUG_JWT_SECRET is required}
      QUALIBUG_CRED_ENC_KEY: ${QUALIBUG_CRED_ENC_KEY:?QUALIBUG_CRED_ENC_KEY is required (the image sets QUALIBUG_REQUIRE_CREDENTIAL_ENCRYPTION=1)}
    volumes:
      # platform_outputs also holds logs (platform_outputs/logs), so there is no
      # separate /app/logs mount -- the old qualibug-logs volume was never written.
      - qualibug-platform-outputs:/app/platform_outputs
      - qualibug-platform-workspace:/app/platform_workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  qualibug-platform-outputs:
  qualibug-platform-workspace:
