name: Apply process event idempotency authority

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.one_shot/process_event_idempotency_authority/.dispatch

permissions:
  contents: write

concurrency:
  group: process-event-idempotency-authority-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source-request idempotency authority
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/.one_shot/process_event_idempotency_authority/apply_compact.py
          python tools/.one_shot/process_event_idempotency_authority/apply_compact.py
          python -m py_compile \
            ai_test_asset_center/process_graph_wait_contract.py \
            ai_test_asset_center/process_graph_event_transition.py \
            ai_test_asset_center/process_graph_async_transition_observer.py \
            tests/test_process_graph_event_transition.py \
            tests/test_process_graph_event_run_scope.py \
            tests/test_process_graph_event_idempotency_source_authority.py

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused async authority regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_process_graph_event_idempotency_source_authority.py \
            tests/test_process_graph_event_transition.py \
            tests/test_process_graph_event_run_scope.py \
            tests/test_process_graph_event_transition_scope.py \
            tests/test_process_graph_event_transition_ledger.py \
            tests/test_process_graph_event_finalizer_scope.py \
            tests/test_process_graph_async_transition_oracle.py \
            tests/test_process_graph_broker_adapter.py \
            tests/test_process_graph_broker_delivery.py \
            tests/test_process_graph_broker_oracle.py \
            tests/test_process_graph_wait_contract.py \
            tests/test_process_graph_wait_source_authority.py

      - name: Run broad process graph regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find tests -maxdepth 1 -type f \
              \( -name 'test_process_graph*.py' \
                 -o -name 'test_cross_system*.py' \
                 -o -name 'test_multi_step*.py' \
                 -o -name 'test_v150_multi_step_protocol.py' \) \
              | sort
          )
          pytest -q "${files[@]}" \
            --deselect tests/test_process_graph_multi_write_equivalence.py::test_missing_one_step_after_cleanup_keeps_graph_indeterminate \
            --deselect tests/test_process_graph_target_preflight.py::test_pregraph_actor_never_receives_credential_deferral \
            --deselect tests/test_process_graph_target_preflight.py::test_fixture_actor_never_receives_credential_deferral

      - name: Commit verified authority to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'qualibug-mainline-bot'
          git config user.email 'qualibug-mainline-bot@users.noreply.github.com'
          git rm -r tools/.one_shot/process_event_idempotency_authority
          git rm .github/workflows/apply-process-event-idempotency-authority.yml
          git add \
            ai_test_asset_center/process_graph_wait_contract.py \
            ai_test_asset_center/process_graph_event_transition.py \
            ai_test_asset_center/process_graph_async_transition_observer.py \
            tests/test_process_graph_event_transition.py \
            tests/test_process_graph_event_run_scope.py \
            tests/test_process_graph_event_idempotency_source_authority.py
          git diff --cached --check
          git commit -m 'fix(process): prove async idempotency scope from source request'
          git push origin HEAD:"${HEAD_REF}"
