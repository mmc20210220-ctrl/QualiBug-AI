name: Apply real E2E lifecycle authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-real-e2e-lifecycle-authority
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-shot/real-e2e-lifecycle-authority
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staged payload integrity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qualibug-payload.sha256 <<'EOF'
          ea9bf822ee18faa98f0e2f132e4199257a2edca70637e27b71d7d55f6ad98aa5  .github/qualibug-e2e-patch.part00a
          5a2e4d862a0eee2111b179546ea93a972f7b803d4bf7273970477c635cb215a7  .github/qualibug-e2e-patch.part00b
          fcee8256f47269779784eac77a774a6bb4e4701bd94270c75bad346dc04ad7a2  .github/qualibug-e2e-patch.part01
          0c27f4aa3a56ee9bde3b57badeb11869239bfd079a2e3ac3d291361a1429d968  .github/qualibug-e2e-patch.part02
          32607abcd266abd1c3af7c1517fb67e4cf00fc3474afd658626a475f579bdc76  .github/qualibug-e2e-patch.part03
          80f58e91b0e131ea04c33f973017fa89b9f54f6cb6fdf5b997987ea470406f41  .github/qualibug-e2e-patch.part04
          EOF
          sha256sum --check /tmp/qualibug-payload.sha256

      - name: Apply verified optimization patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/qualibug-e2e-patch.part00a \
            .github/qualibug-e2e-patch.part00b \
            .github/qualibug-e2e-patch.part01 \
            .github/qualibug-e2e-patch.part02 \
            .github/qualibug-e2e-patch.part03 \
            .github/qualibug-e2e-patch.part04 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/qualibug-real-e2e.patch
          git apply --ignore-space-change --ignore-whitespace --index /tmp/qualibug-real-e2e.patch
          git rm .github/qualibug-e2e-patch.part*
          git rm .github/workflows/apply-real-e2e-lifecycle-authority.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python authority modules
        run: python -m compileall -q ai_test_asset_center tests

      - name: Run real E2E authority regressions
        run: |
          python -m pytest -q \
            tests/test_cleanup_receipt_projection_idempotence.py \
            tests/test_experiment_lifecycle_fixture_authority.py \
            tests/test_finalizer_cleanup_verification_scope.py \
            tests/test_formal_event_post_runtime_execution.py \
            tests/test_formal_event_real_network_e2e.py \
            tests/test_private_pilot_health_liveness_readiness.py \
            tests/test_process_step_bundle_receipt_separation.py \
            tests/test_process_step_graph_aggregate_scope.py \
            tests/test_runtime_plan_lifecycle_authority.py

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): close real end-to-end lifecycle authority'
          git push origin HEAD:one-shot/real-e2e-lifecycle-authority
