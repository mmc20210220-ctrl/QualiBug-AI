name: Temporary apply service-aware operation dedupe on PR ready

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: temp-recall-service-dedupe-pr-ready
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.number == 183 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/recall-service-aware-operation-dedupe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recall-service-aware-operation-dedupe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact patch and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/.one_shot/recall_service_aware_operation_dedupe/apply.py
          python tools/.one_shot/recall_service_aware_operation_dedupe/apply.py
          python -m py_compile \
            ai_test_asset_center/behavior_ir_core.py \
            tests/test_behavior_ir_service_aware_operation_dedupe.py
          git diff --check

      - name: Install package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          python -m pip install -e . -q

      - name: Run focused and existing ownership regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_behavior_ir_service_aware_operation_dedupe.py \
            tests/test_operation_service_ownership_authority.py
          python -m compileall -q ai_test_asset_center

      - name: Commit verified fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qualibug-recall-bot'
          git config user.email 'qualibug-recall-bot@users.noreply.github.com'
          git rm \
            .github/workflows/apply-recall-service-aware-operation-dedupe.yml \
            tools/.one_shot/recall_service_aware_operation_dedupe/apply.py
          git add \
            ai_test_asset_center/behavior_ir_core.py \
            tests/test_behavior_ir_service_aware_operation_dedupe.py
          git diff --cached --check
          git commit -m 'fix(recall): preserve service-aware operation identity'
          git push origin HEAD:fix/recall-service-aware-operation-dedupe
