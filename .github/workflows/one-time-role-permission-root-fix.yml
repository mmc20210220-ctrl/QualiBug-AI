name: One-time role permission root fix

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-role-permission-root-fix
  cancel-in-progress: false

jobs:
  apply-test-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[internal] apply verified role permission root fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          chunk_00 = ''.join([
              '',
              '',
              '',
              '',
              '',
              '',
          ])
          chunk_03 = ''.join([
              '',
              '',
              '',
              '',
              '',
              '',
          ])
          root = Path('.github/delivery/role-permission')
          content = ''.join([
              chunk_00,
              (root / 'chunk-01.b64').read_text(),
              (root / 'chunk-02.b64').read_text(),
              chunk_03,
              (root / 'chunk-04.b64').read_text(),
              (root / 'chunk-05.b64').read_text(),
              (root / 'chunk-06.b64').read_text(),
              (root / 'chunk-07.b64').read_text(),
              '\n',
          ])
          Path('/tmp/role_permission.patch.gz.b64').write_text(content)
          PY
          echo "eb56cb0c13b47aceec96643878c0cfe8af709c864f6d8e62a0c08fcd9a4e640a  /tmp/role_permission.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/role_permission.patch.gz.b64 | gzip -d > /tmp/role_permission.patch
          echo "7f64625392005c005f6fd28e9c3ac4aa9fe4d6993aede9a330f238d34c03fde2  /tmp/role_permission.patch" | sha256sum -c -

      - name: Apply with three-way conflict detection
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --check /tmp/role_permission.patch
          git apply --3way /tmp/role_permission.patch
          git diff --check

      - name: Verify exact role permission scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/authorization_comparison_contract.py
          ai_test_asset_center/authorization_delivery_gate.py
          ai_test_asset_center/authorization_oracle_causality.py
          ai_test_asset_center/behavior_ir.py
          ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/authorization_semantics.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/explicit_fact_semantic_normalization.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_resolution.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py
          ai_test_asset_center/historical_authorization_quarantine.py
          tests/test_enterprise_understanding_actor_permission_contract.py
          tests/test_enterprise_understanding_authorization_delivery_gate.py
          tests/test_enterprise_understanding_authorization_oracle_causality.py
          tests/test_enterprise_understanding_historical_authorization_quarantine.py
          tests/test_enterprise_understanding_role_permission_executor_e2e.py
          EOF
          git status --short | awk '{print $2}' | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile role permission authority
        shell: bash
        run: |
          python -m py_compile \
            ai_test_asset_center/authorization_comparison_contract.py \
            ai_test_asset_center/authorization_delivery_gate.py \
            ai_test_asset_center/authorization_oracle_causality.py \
            ai_test_asset_center/behavior_ir.py \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/authorization_semantics.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/explicit_fact_semantic_normalization.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_resolution.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py \
            ai_test_asset_center/historical_authorization_quarantine.py \
            tests/test_enterprise_understanding_actor_permission_contract.py \
            tests/test_enterprise_understanding_authorization_delivery_gate.py \
            tests/test_enterprise_understanding_authorization_oracle_causality.py \
            tests/test_enterprise_understanding_historical_authorization_quarantine.py \
            tests/test_enterprise_understanding_role_permission_executor_e2e.py

      - name: Run role permission regressions
        shell: bash
        run: |
          pytest -q \
            tests/test_enterprise_understanding_actor_permission_contract.py \
            tests/test_enterprise_understanding_role_permission_executor_e2e.py \
            tests/test_enterprise_understanding_authorization_oracle_causality.py \
            tests/test_enterprise_understanding_authorization_delivery_gate.py \
            tests/test_enterprise_understanding_historical_authorization_quarantine.py \
            tests/test_chinese_business_comprehension.py
          pytest -q tests/test_behavior_ir_obligation_experiment.py -k 'permission or authorization or actor'

      - name: Commit root-cause changes and remove one-time delivery artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QualiBug Automation"
          git config user.email "automation@qualibug.local"
          git add -A
          git rm .github/workflows/one-time-role-permission-root-fix.yml
          git rm -r .github/delivery/role-permission
          git rm .github/patches/role_permission_root_fix.patch.gz.b64
          git commit -m 'fix(auth): unify role permission authority end to end' \
            -m 'Derive source-backed role permissions once, preserve them through fact identity and Behavior IR, compile only exact actor-action-resource coordinates, and bind collection authorization evidence to content-addressed observer resource proofs without weakening explicit materialization requirements. Add real executor positive and negative end-to-end regressions.'

      - name: Rebase and push main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
