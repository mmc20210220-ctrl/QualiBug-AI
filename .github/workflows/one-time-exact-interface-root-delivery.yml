name: One-time exact interface root delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/exact-interface-root-delivery.trigger'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-time-exact-interface-root-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/exact-interface-root-delivery-20260801')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone latest main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'

      - name: Verify and apply immutable source change
        working-directory: repo
        run: |
          set -euo pipefail
          payload=.github/delivery/exact-interface-root.patch.gz.b64
          echo '17143372267e104e4fa091ea13880b67557f73e6ca2c0165a342cfdaac9d9477  '"${payload}" | sha256sum -c -
          base64 -d "${payload}" | gzip -d > /tmp/exact-interface-root.patch
          echo 'e40ac9cbbc6b803e09bdf28ebf16d8e6bd79e9507ff4f6b1a42617e8e9df8813  /tmp/exact-interface-root.patch' | sha256sum -c -
          git apply --3way --check /tmp/exact-interface-root.patch
          git apply --3way /tmp/exact-interface-root.patch
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir_governance.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding_governance.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/schema.py
          tests/test_behavior_exact_interface_attachment.py
          EOF
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install verification dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run focused regressions
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m compileall -q ai_test_asset_center benchmark_evaluator tests
          python3 -m pytest -q \
            tests/test_behavior_exact_interface_attachment.py \
            tests/test_behavior_implementation_binding_relationships.py \
            tests/test_enterprise_understanding_responsibility_authorization_boundary.py \
            tests/test_enterprise_understanding_authorization_unknown_propagation.py
          git diff --check

      - name: Commit normal source and remove delivery assets
        working-directory: repo
        run: |
          set -euo pipefail
          git rm .github/delivery/exact-interface-root.patch.gz.b64
          git rm .github/workflows/one-time-exact-interface-root-delivery.yml
          git rm -f .github/exact-interface-root-delivery.trigger || true
          git add -A
          git commit -m 'fix(understanding): preserve exact interface and scope identity' \
            -m 'Carry ingestion-authored OpenAPI interface identity through Fact to Behavior evidence, prevent own-scope and tenant-scope behaviors from remerging, and let the existing governed binder consume exact source attachments without fuzzy endpoint selection.'

      - name: Rebase, reverify, and push main
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]]; then
            git rebase origin/main
            python3 -m compileall -q ai_test_asset_center benchmark_evaluator tests
            python3 -m pytest -q \
              tests/test_behavior_exact_interface_attachment.py \
              tests/test_behavior_implementation_binding_relationships.py \
              tests/test_enterprise_understanding_responsibility_authorization_boundary.py \
              tests/test_enterprise_understanding_authorization_unknown_propagation.py
            git diff --check
          fi
          git push origin HEAD:main
          gh pr close 115 --repo "${{ github.repository }}" --comment 'Verified exact-interface root fix delivered to main; temporary delivery assets removed in the source commit.' || true
