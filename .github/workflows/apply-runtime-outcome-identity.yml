name: Apply runtime outcome identity authority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-runtime-outcome-identity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard authoritative inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_plan.py)" = "6e21593ca034957db54d73e8091dfd99581a13c2"
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_materialization_governance.py)" = "8cd706ee0f6bd5a5630745e9571412f9bf95ed74"
          test "$(git hash-object tests/test_runtime_plan_v1.py)" = "c563541328236fd42f372041eef7c94c5f9dee2e"
          test ! -e tests/test_runtime_outcome_identity_chain.py
          test "$(git hash-object .github/runtime-outcome-identity/payload.00)" = "a52a2aea0b10267f8b7d7690e943aa3ebecd6486"
          test "$(git hash-object .github/runtime-outcome-identity/payload.01)" = "862f954e0ede874b804e7c2b5987847e4645d414"
          test "$(git hash-object .github/runtime-outcome-identity/payload.02)" = "3b11cd7b7fda82b91f86443df2e0be73b1188d4f"
          test "$(git hash-object .github/runtime-outcome-identity/payload.03)" = "a41c48752caf4b52a72a30cf1f79e9fafb74e802"
          test "$(git hash-object .github/runtime-outcome-identity/payload.04)" = "f18daa73c261d1543ef4d77a6b65dfb89f7b9735"
          test "$(git hash-object .github/runtime-outcome-identity/payload.05)" = "83be2c40e581d8aac8bd5b77662e8fdc5ade2ea7"
          test "$(git hash-object .github/runtime-outcome-identity/payload.06)" = "17d4cd83cdb0465293b2046ac3086ad95831030b"

      - name: Apply and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/runtime-outcome-identity/payload.* | base64 --decode > /tmp/runtime-outcome-identity.tar.gz
          test "$(sha1sum /tmp/runtime-outcome-identity.tar.gz | awk '{print $1}')" = "5ab703d11d74ab00be883afed134ada1a1426cda"
          tar -xzf /tmp/runtime-outcome-identity.tar.gz -C .
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_plan.py)" = "5c59ef8e87129dabe77814829feda36a6374757d"
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_materialization_governance.py)" = "bc6eb2391454b0e3d6a0befc8958df3f18a899b2"
          test "$(git hash-object tests/test_runtime_plan_v1.py)" = "ee3659a7fee5ca64e7b8e526a87effc4e0ef5b70"
          test "$(git hash-object tests/test_runtime_outcome_identity_chain.py)" = "d2a96d72978740ff797725da04fc6e2c7d115a75"
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_plan.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_materialization_governance.py \
            tests/test_runtime_plan_v1.py \
            tests/test_runtime_outcome_identity_chain.py
          pytest -q tests/test_runtime_plan_v1.py tests/test_runtime_outcome_identity_chain.py

      - name: Commit authoritative implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/runtime-outcome-identity
          rm -f .github/workflows/apply-runtime-outcome-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(understanding): preserve outcome identity through runtime planning"
          git push origin HEAD:main
