name: Mainline Root Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mainline-root-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile mainline authorities
        run: |
          python -m py_compile \
            ai_test_asset_center/project_runtime_primitives.py \
            ai_test_asset_center/private_pilot_project_assets.py \
            ai_test_asset_center/private_pilot_tenant_auth.py \
            ai_test_asset_center/private_pilot_auth_scope.py \
            ai_test_asset_center/private_pilot_service.py \
            ai_test_asset_center/private_pilot_entrypoint.py \
            ai_test_asset_center/private_pilot_http_routing.py \
            ai_test_asset_center/private_pilot_scan_handlers.py \
            ai_test_asset_center/private_pilot_ingest_handlers.py \
            ai_test_asset_center/private_pilot_ops_handlers.py \
            ai_test_asset_center/replay_engine.py \
            ai_test_asset_center/ssrf_guard.py \
            ai_test_asset_center/db_persistence.py \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/experiment_compiler_obligation.py \
            ai_test_asset_center/experiment_lifecycle_runtime.py \
            ai_test_asset_center/experiment_outcome_finalizer.py \
            ai_test_asset_center/operational_receipts.py \
            ai_test_asset_center/process_step_evidence_scope_audit.py \
            ai_test_asset_center/process_step_receipt_scope.py \
            ai_test_asset_center/process_step_semantic_view.py \
            ai_test_asset_center/formal_event_pre_cleanup.py \
            ai_test_asset_center/formal_event_observation_count_bridge.py \
            ai_test_asset_center/formal_event_execution_outcome_bridge.py
      - name: Run P0 root regression suite
        env:
          QUALIBUG_JWT_SECRET: ci-mainline-root-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          pytest -q \
            tests/test_p0_root_security_boundaries.py \
            tests/test_p0_atomic_mainline_contracts.py \
            tests/test_process_step_semantic_view.py \
            tests/test_compiled_http_observer_bundle_scope.py \
            tests/test_process_graph_event_finalizer_scope.py \
            tests/test_formal_event_mainline.py \
            tests/test_formal_event_runtime_execution.py \
            tests/test_formal_event_post_runtime_execution.py

  publish-status:
    name: Publish root regression status
    if: always()
    needs: root-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Publish legacy commit status
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.root-contracts.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'qualibug/mainline-root-regression',
              description: passed
                ? 'Mainline root regression passed'
                : 'Mainline root regression failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
