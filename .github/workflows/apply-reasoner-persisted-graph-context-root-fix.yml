name: Apply reasoner persisted graph context root fix

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - '.github/.reasoner-persisted-graph-context-root-fix-trigger'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: reasoner-persisted-graph-context-root-fix-main
  cancel-in-progress: false

jobs:
  root-fix:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event.issue.title == 'RUN_REASONER_PERSISTED_GRAPH_CONTEXT_ROOT_FIX_20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply persisted Graph Context bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
          python tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
          python -m py_compile ai_test_asset_center/discovery_runtime_planning.py
          python -m py_compile tests/test_reasoner_persisted_graph_context_bridge.py
          git diff --check

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run focused root-cause regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_reasoner_persisted_graph_context_bridge.py
          mapfile -t GRAPH_TESTS < <(grep -rlE '_graph_evidence_pack|QUALIBUG_GRAPH_CONTEXT_MODE|GraphContextComposer' tests --include='test_*.py' | grep -v 'test_reasoner_persisted_graph_context_bridge.py' | head -20 || true)
          if [ "${#GRAPH_TESTS[@]}" -gt 0 ]; then
            printf 'Existing graph-context regression files:\n%s\n' "${GRAPH_TESTS[*]}"
            python -m pytest -q "${GRAPH_TESTS[@]}"
          fi

      - name: Run persisted-understanding lifecycle regression set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PERSIST_TESTS < <(grep -rlE 'load_enterprise_business_knowledge_asset|project_knowledge_world_model|persisted.*knowledge|knowledge.*persist' tests --include='test_*.py' | grep -v 'test_reasoner_persisted_graph_context_bridge.py' | head -20 || true)
          if [ "${#PERSIST_TESTS[@]}" -gt 0 ]; then
            printf 'Existing persistence regression files:\n%s\n' "${PERSIST_TESTS[*]}"
            python -m pytest -q "${PERSIST_TESTS[@]}"
          fi

      - name: Commit verified root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qualibug-mainline-bot'
          git config user.email 'qualibug-mainline-bot@users.noreply.github.com'
          git rm -r tools/.one_shot/reasoner_persisted_graph_context_root_fix
          git rm .github/workflows/apply-reasoner-persisted-graph-context-root-fix.yml
          git rm -f .github/workflows/apply-reasoner-persisted-graph-context-pr.yml || true
          git rm -f .github/.reasoner-persisted-graph-context-root-fix-trigger || true
          git add ai_test_asset_center/discovery_runtime_planning.py tests/test_reasoner_persisted_graph_context_bridge.py
          git diff --cached --check
          git commit -m 'fix(discovery): feed persisted knowledge into reasoner graph context'
          git pull --rebase origin main
          git push origin HEAD:main
