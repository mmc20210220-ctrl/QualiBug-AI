name: Verify recall coverage authority root fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: recall-coverage-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  root-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact coverage authority patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ordered_operation_sequence_identity' ai_test_asset_center/coverage_unit_registry.py \
             && grep -q 'coverage_lineage' ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
             && test -f tests/test_recall_coverage_authority.py; then
            echo 'Product patch already committed on PR head; verifying exact files.'
          else
            python -m py_compile tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
            python tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
          fi
          python -m py_compile \
            ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
            ai_test_asset_center/discovery_runtime_planning.py \
            ai_test_asset_center/coverage_unit_registry.py \
            tests/test_recall_coverage_authority.py
          git diff --check

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run focused recall regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_recall_coverage_authority.py

      - name: Run existing coverage and planning regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RELATED < <(grep -rlE 'compute_obligation_coverage_gaps|build_behavior_ir_coverage_map|coverage_unit_registry|derive_canonical_obligation_key' tests --include='test_*.py' | grep -v 'test_recall_coverage_authority.py' | head -40 || true)
          if [ "${#RELATED[@]}" -gt 0 ]; then
            printf 'Related regression files:\n%s\n' "${RELATED[*]}"
            python -m pytest -q "${RELATED[@]}"
          fi

      - name: Compile package surface
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ai_test_asset_center

      - name: Package verified patched files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recall-patch/ai_test_asset_center /tmp/recall-patch/tests
          cp ai_test_asset_center/behavior_ir_hypothesis_coverage.py /tmp/recall-patch/ai_test_asset_center/
          cp ai_test_asset_center/discovery_runtime_planning.py /tmp/recall-patch/ai_test_asset_center/
          cp ai_test_asset_center/coverage_unit_registry.py /tmp/recall-patch/ai_test_asset_center/
          cp tests/test_recall_coverage_authority.py /tmp/recall-patch/tests/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recall-coverage-authority-patch
          path: /tmp/recall-patch
          if-no-files-found: error
