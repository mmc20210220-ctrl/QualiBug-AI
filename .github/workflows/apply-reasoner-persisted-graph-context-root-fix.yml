name: Apply recall coverage authority root fix

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: recall-coverage-authority-main
  cancel-in-progress: false

jobs:
  root-fix:
    if: >-
      github.event_name == 'schedule' ||
      github.event.issue.title == 'RUN_RECALL_COVERAGE_AUTHORITY_ROOT_FIX_20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact coverage authority patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
          python tools/.one_shot/reasoner_persisted_graph_context_root_fix/apply.py
          python -m py_compile \
            ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
            ai_test_asset_center/discovery_runtime_planning.py \
            ai_test_asset_center/coverage_unit_registry.py \
            tests/test_recall_coverage_authority.py
          git diff --check
          git diff --cached --check

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run focused recall regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_recall_coverage_authority.py

      - name: Run existing coverage and planning regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RELATED < <(grep -rlE 'compute_obligation_coverage_gaps|build_behavior_ir_coverage_map|coverage_unit_registry|derive_canonical_obligation_key' tests --include='test_*.py' | grep -v 'test_recall_coverage_authority.py' | head -40 || true)
          if [ "${#RELATED[@]}" -gt 0 ]; then
            printf 'Related regression files:\n%s\n' "${RELATED[*]}"
            python -m pytest -q "${RELATED[@]}"
          fi

      - name: Compile package surface
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ai_test_asset_center

      - name: Commit verified root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qualibug-mainline-bot'
          git config user.email 'qualibug-mainline-bot@users.noreply.github.com'
          git rm -r tools/.one_shot/reasoner_persisted_graph_context_root_fix
          git rm .github/workflows/apply-reasoner-persisted-graph-context-root-fix.yml
          git rm -f .github/workflows/apply-reasoner-persisted-graph-context-pr.yml || true
          git rm -f .github/.reasoner-persisted-graph-context-root-fix-trigger || true
          git rm -f .github/workflows/apply-recall-coverage-authority-main.yml || true
          git add \
            ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
            ai_test_asset_center/discovery_runtime_planning.py \
            ai_test_asset_center/coverage_unit_registry.py \
            tests/test_recall_coverage_authority.py
          git diff --cached --check
          git commit -m 'fix(discovery): make behavior coverage identity exact'
          git pull --rebase origin main
          git push origin HEAD:main
