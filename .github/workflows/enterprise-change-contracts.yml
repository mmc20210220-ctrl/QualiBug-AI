name: Enterprise Change Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  change-impact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate change-impact implementation
        run: |
          python -c "import ast; ast.parse(open('ai_test_asset_center/change_impact.py').read()); print('change_impact.py OK')"
          python -m pytest tests/test_phase111_change_impact.py -q
