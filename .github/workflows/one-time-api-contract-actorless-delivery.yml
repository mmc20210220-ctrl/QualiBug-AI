name: One-time API contract and actorless runtime delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-api-contract-actorless-delivery.yml'

permissions:
  contents: write

concurrency:
  group: one-time-api-contract-actorless-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'mmc20210220-ctrl/QualiBug-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify delivery base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8c3e8c26da3b1d699894dd34b926602b3c12701b"

