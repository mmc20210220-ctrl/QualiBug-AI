name: UI complex interactions

on:
  push:
    branches: [main]
    paths:
      - 'ai_test_asset_center/professional_ui_complex_*.py'
      - 'ai_test_asset_center/professional_ui_persistent_cleanup_probe.py'
      - 'ai_test_asset_center/private_pilot_complex_interaction_health_patch.py'
      - 'ai_test_asset_center/enterprise_knowledge_center/_formal_ui_complex_interaction_guard.py'
      - 'ai_test_asset_center/enterprise_knowledge_center/_formal_ui_persistent_probe_guard.py'
      - 'ai_test_asset_center/visual_baseline_registry.py'
      - 'frontend/src/components/settings/SettingsComplexInteractionSection.tsx'
      - 'frontend/src/lib/complex-interaction-contract.ts'
      - 'frontend/src/components/settings/SettingsInfoSection.tsx'
      - 'tests/test_professional_ui_complex_*.py'
      - 'tests/test_private_pilot_complex_interaction_health.py'
      - '.github/workflows/ui-complex-interactions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-complex-interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,browser]'
      - name: Run complex interaction contract tests
        run: >-
          python -m pytest -q
          tests/test_professional_ui_complex_interactions.py
          tests/test_professional_ui_complex_interaction_finalizer.py
          tests/test_professional_ui_complex_origin_guard.py
          tests/test_private_pilot_complex_interaction_health.py

  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck complex interaction helper
        run: npm run typecheck
      - name: Lint complex interaction helper
        run: npm run lint
