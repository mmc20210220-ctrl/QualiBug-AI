name: Apply service-aware operation dedupe Recall fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: recall-service-aware-operation-dedupe-main-trigger
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.issue.title == 'RUN_RECALL_SERVICE_AWARE_OPERATION_DEDUPE_20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recall-service-aware-operation-dedupe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply and verify Recall fix
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '== exact patch =='
            python -m py_compile tools/.one_shot/recall_service_aware_operation_dedupe/apply.py && \
            python tools/.one_shot/recall_service_aware_operation_dedupe/apply.py && \
            python -m py_compile \
              ai_test_asset_center/behavior_ir_core.py \
              tests/test_behavior_ir_service_aware_operation_dedupe.py && \
            git diff --check && \
            echo '== install ==' && \
            python -m pip install --upgrade pip -q && \
            python -m pip install -e . -q && \
            echo '== focused Recall regressions ==' && \
            python -m pytest -q \
              tests/test_behavior_ir_service_aware_operation_dedupe.py \
              tests/test_operation_service_ownership_authority.py && \
            echo '== related Behavior IR regressions ==' && \
            bash -c 'mapfile -t RELATED < <(grep -rlE "transport_identity|service.*operation|operation.*service|build_behavior_ir_from_knowledge_asset" tests --include="test_*.py" | grep -v "test_behavior_ir_service_aware_operation_dedupe.py" | head -60 || true); if [ "${#RELATED[@]}" -gt 0 ]; then printf "Related regression files:\n%s\n" "${RELATED[*]}"; python -m pytest -q "${RELATED[@]}"; fi' && \
            echo '== package compile ==' && \
            python -m compileall -q ai_test_asset_center
          } 2>&1 | tee /tmp/service-aware-dedupe.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'Service-aware operation dedupe Recall fix FAILED verification.'
              echo
              echo '```text'
              tail -n 160 /tmp/service-aware-dedupe.log
              echo '```'
            } > /tmp/issue-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true
            exit "$status"
          fi

          git config user.name 'qualibug-recall-bot'
          git config user.email 'qualibug-recall-bot@users.noreply.github.com'
          git rm \
            .github/workflows/apply-recall-service-aware-operation-dedupe.yml \
            tools/.one_shot/recall_service_aware_operation_dedupe/apply.py
          git add \
            ai_test_asset_center/behavior_ir_core.py \
            tests/test_behavior_ir_service_aware_operation_dedupe.py
          git diff --cached --check
          git commit -m 'fix(recall): preserve service-aware operation identity'
          git push origin HEAD:fix/recall-service-aware-operation-dedupe
          commit_sha=$(git rev-parse HEAD)
          {
            echo "Service-aware operation dedupe Recall fix PASSED and was pushed to PR branch: \`$commit_sha\`."
            echo
            echo 'Verification: exact-match patch, py_compile, git diff --check, focused Recall regressions, related Behavior IR regressions, compileall.'
            echo
            echo '```text'
            tail -n 100 /tmp/service-aware-dedupe.log
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true

      - name: Remove temporary main trigger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/apply-recall-service-aware-operation-dedupe-main.yml ]; then
            git rm .github/workflows/apply-recall-service-aware-operation-dedupe-main.yml
            git config user.name 'qualibug-recall-bot'
            git config user.email 'qualibug-recall-bot@users.noreply.github.com'
            git commit -m 'chore: remove service-aware dedupe one-shot trigger'
            git push origin HEAD:main
          fi
