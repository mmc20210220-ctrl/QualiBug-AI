name: Dispatch role permission root fix

on:
  push:
    branches: [main]
    paths:
      - ".github/role-permission-root-fix-trigger"
  pull_request_target:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'internal-identity-table-dispatch' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/one-time-role-permission-root-fix.yml/dispatches" \
            -d '{"ref":"main"}'
