name: Document ingestion closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/enterprise_knowledge_center/document_ingestion/**"
      - "ai_test_asset_center/enterprise_knowledge_center/archive_expansion.py"
      - "ai_test_asset_center/enterprise_knowledge_center/archive_ingestion.py"
      - "ai_test_asset_center/enterprise_knowledge_center/archive_ingestion_core.py"
      - "ai_test_asset_center/enterprise_knowledge_center/source_ingestion.py"
      - "ai_test_asset_center/enterprise_knowledge_center/_crud.py"
      - "ai_test_asset_center/private_pilot_ingest_authority.py"
      - "ai_test_asset_center/enterprise_source_registry_lifecycle.py"
      - "ai_test_asset_center/enterprise_knowledge_center/_document_ir_fact_evidence.py"
      - "ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/document_structure_gate.py"
      - "tests/test_enterprise_document_ingestion_closure.py"
      - "tests/test_enterprise_source_document_ir_bridge.py"
      - "tests/test_enterprise_source_runtime_bridge.py"
      - "tests/test_source_registry_lifecycle.py"
      - "tests/test_document_ingestion_text_first_planner.py"
      - "tests/test_compatible_office_normalization.py"
      - "tests/test_office_adapter_policy_contracts.py"
      - "tests/test_office_format_identity_planner.py"
      - "tests/test_document_adapter_runtime_readiness.py"
      - "tests/test_office_runtime_capabilities.py"
      - "tests/test_office_container_inspection.py"
      - "tests/test_office_container_resource_limits.py"
      - "tests/test_enterprise_archive_expansion.py"
      - "tests/test_enterprise_archive_ingestion_transaction.py"
      - "tests/test_archive_ingestion.py"
      - "tests/test_archive_ingestion_atomicity.py"
      - "tests/test_private_pilot_ingest_authority.py"
      - "tests/test_archive_explicit_type_override.py"
      - "tests/test_document_ir_fact_evidence_spans.py"
      - "tests/test_document_structure_fact_receipt_gate.py"
      - "tests/test_document_evidence_address_quality.py"
      - "tests/test_office_visual_ocr_supplemental.py"
      - "tests/test_document_runtime_packaging.py"
      - "tests/test_generated_structure_label_authority.py"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/document-ingestion-closure.yml"

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile changed modules
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/contract.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/office_adapters.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/compatible_office_adapter.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/native_office_policy_adapters.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/office_runtime_capabilities.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/office_container_inspection.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/guarded_compatible_office_adapter.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/page_render_registry.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/evidence_closure.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/rendered_ocr_adapter.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/pipeline.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/planner.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/registry.py \
            ai_test_asset_center/enterprise_knowledge_center/archive_expansion.py \
            ai_test_asset_center/enterprise_knowledge_center/archive_ingestion.py \
            ai_test_asset_center/enterprise_knowledge_center/archive_ingestion_core.py \
            ai_test_asset_center/enterprise_knowledge_center/source_ingestion.py \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/private_pilot_ingest_authority.py \
            ai_test_asset_center/enterprise_source_registry_lifecycle.py \
            ai_test_asset_center/enterprise_knowledge_center/_document_ir_fact_evidence.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/document_structure_gate.py

      - name: Run focused closure tests
        run: |
          pytest -q \
            tests/test_enterprise_document_ingestion_closure.py \
            tests/test_enterprise_source_document_ir_bridge.py \
            tests/test_enterprise_source_runtime_bridge.py \
            tests/test_source_registry_lifecycle.py \
            tests/test_document_ingestion_text_first_planner.py \
            tests/test_compatible_office_normalization.py \
            tests/test_office_adapter_policy_contracts.py \
            tests/test_office_format_identity_planner.py \
            tests/test_document_adapter_runtime_readiness.py \
            tests/test_office_runtime_capabilities.py \
            tests/test_office_container_inspection.py \
            tests/test_office_container_resource_limits.py \
            tests/test_enterprise_archive_expansion.py \
            tests/test_enterprise_archive_ingestion_transaction.py \
            tests/test_archive_ingestion.py \
            tests/test_archive_ingestion_atomicity.py \
            tests/test_private_pilot_ingest_authority.py \
            tests/test_archive_explicit_type_override.py \
            tests/test_document_ir_fact_evidence_spans.py \
            tests/test_document_structure_fact_receipt_gate.py \
            tests/test_document_evidence_address_quality.py \
            tests/test_office_visual_ocr_supplemental.py \
            tests/test_document_runtime_packaging.py \
            tests/test_generated_structure_label_authority.py
