name: Document ingestion closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/enterprise_material_formats.py"
      - "ai_test_asset_center/policies/semantic_lexicon.json"
      - "ai_test_asset_center/enterprise_knowledge_center/**"
      - "ai_test_asset_center/implicit_rule_runtime_evolution.py"
      - "ai_test_asset_center/discovery_mainline.py"
      - "ai_test_asset_center/authorization_comparison_contract.py"
      - "ai_test_asset_center/authorization_oracle_causality.py"
      - "ai_test_asset_center/authorization_delivery_gate.py"
      - "ai_test_asset_center/binding_materialization_identity_receipt.py"
      - "ai_test_asset_center/historical_authorization_quarantine.py"
      - "ai_test_asset_center/historical_authorization_artifact_migration.py"
      - "ai_test_asset_center/historical_authorization_inventory.py"
      - "ai_test_asset_center/private_pilot_historical_authorization_migration.py"
      - "ai_test_asset_center/experiment_compiler.py"
      - "ai_test_asset_center/experiment_executor.py"
      - "ai_test_asset_center/experiment_executor_governance.py"
      - "ai_test_asset_center/formal_delivery_scope.py"
      - "ai_test_asset_center/formal_delivery_authority.py"
      - "ai_test_asset_center/private_pilot_service.py"
      - "ai_test_asset_center/experiment_runtime_support.py"
      - "ai_test_asset_center/enterprise_source_registry_lifecycle.py"
      - "ai_test_asset_center/private_pilot_project_assets.py"
      - "ai_test_asset_center/private_pilot_ingest_authority.py"
      - "benchmark_evaluator/enterprise_understanding/**"
      - "tests/test_*document*.py"
      - "tests/test_*archive*.py"
      - "tests/test_*office*.py"
      - "tests/test_authorization_comparison_identity_symmetry.py"
      - "tests/test_enterprise_source_*.py"
      - "tests/test_source_registry_lifecycle.py"
      - "tests/test_source_occurrence_*.py"
      - "tests/test_enterprise_understanding_*.py"
      - "tests/test_implicit_rule_*.py"
      - "tests/test_api_artifact_document_adapter.py"
      - "tests/test_openapi_schema_projection.py"
      - "tests/test_tabular_semantics_ingestion_bridge.py"
      - "tests/test_multi_row_test_case_semantics.py"
      - "tests/test_test_asset_source_types.py"
      - "tests/test_private_pilot_ingest_authority.py"
      - "tests/test_generated_structure_label_authority.py"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/document-ingestion-closure.yml"

concurrency:
  group: document-ingestion-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile ingestion and evaluator authorities
        run: |
          python -m compileall -q \
            ai_test_asset_center/enterprise_knowledge_center \
            benchmark_evaluator/enterprise_understanding
          python -m py_compile \
            ai_test_asset_center/implicit_rule_runtime_evolution.py \
            ai_test_asset_center/discovery_mainline.py \
            ai_test_asset_center/authorization_comparison_contract.py \
            ai_test_asset_center/authorization_oracle_causality.py \
            ai_test_asset_center/authorization_delivery_gate.py \
            ai_test_asset_center/binding_materialization_identity_receipt.py \
            ai_test_asset_center/historical_authorization_quarantine.py \
            ai_test_asset_center/historical_authorization_artifact_migration.py \
            ai_test_asset_center/historical_authorization_inventory.py \
            ai_test_asset_center/private_pilot_historical_authorization_migration.py \
            ai_test_asset_center/experiment_compiler.py \
            ai_test_asset_center/experiment_executor.py \
            ai_test_asset_center/experiment_executor_governance.py \
            ai_test_asset_center/formal_delivery_scope.py \
            ai_test_asset_center/formal_delivery_authority.py \
            ai_test_asset_center/private_pilot_service.py

      - name: Smoke installed authorization inventory CLI
        run: |
          mkdir -p "$RUNNER_TEMP/qualibug-empty-root"
          qualibug-authorization-inventory \
            --root "$RUNNER_TEMP/qualibug-empty-root" \
            --stdout-only \
            --compact

      - name: Run document ingestion closure
        run: |
          pytest -q \
            tests/test_enterprise_document_ingestion_closure.py \
            tests/test_enterprise_source_document_ir_bridge.py \
            tests/test_enterprise_source_runtime_bridge.py \
            tests/test_source_registry_lifecycle.py \
            tests/test_document_*.py \
            tests/test_office_*.py \
            tests/test_compatible_office_normalization.py \
            tests/test_api_artifact_document_adapter.py \
            tests/test_openapi_schema_projection.py \
            tests/test_enterprise_archive_*.py \
            tests/test_archive_*.py \
            tests/test_private_pilot_ingest_authority.py \
            tests/test_multi_row_test_case_semantics.py \
            tests/test_tabular_semantics_ingestion_bridge.py \
            tests/test_test_asset_source_types.py \
            tests/test_generated_structure_label_authority.py \
            tests/test_authorization_comparison_identity_symmetry.py \
            tests/test_enterprise_understanding_authorization_oracle_causality.py \
            tests/test_enterprise_understanding_authorization_delivery_*.py \
            tests/test_enterprise_understanding_binding_materialization_identity_receipt.py \
            tests/test_enterprise_understanding_historical_authorization_*.py \
            tests/test_enterprise_understanding_ingestion_evidence*.py \
            tests/test_enterprise_understanding_document_ground_truth.py \
            tests/test_enterprise_understanding_source_*.py \
            tests/test_enterprise_understanding_product_source_references.py \
            tests/test_enterprise_understanding_actor_permission_contract.py \
            tests/test_enterprise_understanding_authorization_coordinate_edge.py \
            tests/test_enterprise_understanding_authorization_unknown_propagation.py \
            tests/test_enterprise_understanding_credential_identity_coordinates.py \
            tests/test_enterprise_understanding_experiment_actor_credential_identity.py \
            tests/test_enterprise_understanding_responsibility_authorization_boundary.py \
            tests/test_enterprise_understanding_structure_first_facts.py \
            tests/test_enterprise_understanding_fact_slots.py \
            tests/test_enterprise_understanding_fact_probe_policy.py \
            tests/test_implicit_rule_*.py \
            tests/test_source_occurrence_*.py
