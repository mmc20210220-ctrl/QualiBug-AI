name: One-time single-object Windows delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-time-single-object-windows-delivery
  cancel-in-progress: true

jobs:
  deliver:
    if: github.head_ref == 'one-shot/single-object-complex-lifecycle'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply verified single-object lifecycle source
        run: bash .github/delivery/single-object-complex-main/apply-verified-root-fix.sh
