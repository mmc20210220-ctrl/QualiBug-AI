name: One-time Chinese explicit fact mutation probe

on:
  push:
    branches: [main]
    paths:
      - ".github/chinese-fact-mutation-probe-trigger"

permissions:
  contents: write

concurrency:
  group: one-time-chinese-fact-mutation-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run mutation probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from typing import Any

          from ai_test_asset_center.enterprise_knowledge_center._chinese_business_comprehension import analyze_chinese_business_source
          from ai_test_asset_center.enterprise_knowledge_center.enterprise_understanding.structured_fact_compiler import compile_structure_first_business_facts

          def text(v: Any) -> str:
              return str(v or '').strip()

          def rows(v: Any) -> list[dict[str, Any]]:
              return [dict(x) for x in v if isinstance(x, dict)] if isinstance(v, list) else []

          def asset() -> dict[str, Any]:
              return {
                  'business_objects': [
                      {'object': x} for x in ['订单','组织','采购订单','订单头','订单明细','发票','结算单','库存','退款金额','实付金额','优惠金额','应付金额','单价','数量']
                  ],
                  'roles': [{'role': x} for x in ['管理员','订单创建人','创建人','财务人员','系统','其他人']],
                  'rule_library': [], 'coverage_gaps': [], 'summary': {}, 'governance': {},
              }

          def compact(f: dict[str, Any]) -> dict[str, Any]:
              action = f.get('action') if isinstance(f.get('action'), dict) else {}
              subject = f.get('subject') if isinstance(f.get('subject'), dict) else {}
              obj = f.get('object') if isinstance(f.get('object'), dict) else {}
              return {
                  'id': f.get('fact_id'), 'status': f.get('status'),
                  'fact_type': f.get('fact_type') or f.get('kind'),
                  'predicate': f.get('predicate') or action.get('canonical') or action.get('raw'),
                  'actors': subject.get('actor_refs') or [],
                  'subjects': subject.get('entity_refs') or [],
                  'objects': obj.get('entity_refs') or [],
                  'conditions': f.get('conditions') or (f.get('condition_frame') or {}).get('conditions') or [],
                  'modality': f.get('modality'),
                  'quantity': f.get('quantity_constraints') or [],
                  'formula': f.get('formula_constraints') or [],
                  'postconditions': f.get('postconditions') or [],
                  'raw': f.get('raw_statement'),
              }

          def compat(statement: str) -> list[dict[str, Any]]:
              _coverage, facts, _glossary = analyze_chinese_business_source(
                  {'source_id':'mutation', 'filename':'mutation.md', 'text':statement}, asset=asset()
              )
              return [compact(f) for f in facts]

          def structured(statement: str) -> list[dict[str, Any]]:
              locator = f'mutation.md#line=1;chars=0-{len(statement)}'
              source = {
                  'source_id':'mutation', 'filename':'mutation.md', 'text':statement,
                  'document_structure': {'schema':'qualibug.document-structure-ir.v1','blocks':[{
                      'block_id':'block:1','type':'PARAGRAPH','region':'body','text':statement,'order':1,
                      'source_locator':locator,
                      'evidence_address':{'source_id':'mutation','source_locator':locator,'address_kind':'EXACT_SOURCE_LOCATOR'},
                  }]},
              }
              base = asset()
              base['business_fact_ledger'] = {'schema':'qualibug.business-fact-ledger.v1','items':[]}
              base['enterprise_comprehension_gate'] = {'status':'PASS','entry_allowed':True}
              result = compile_structure_first_business_facts(base, [source])
              return [compact(f) for f in rows((result.get('business_fact_ledger') or {}).get('items'))]

          CASES = [
              {'id':'exact_one_only_can','mode':'structured','text':'每张发票仅能关联一个结算单。','expect':{'type':'CARDINALITY_CONSTRAINT','predicate':'EXACTLY_ONE','objects':['发票','结算单']}},
              {'id':'at_most_one','mode':'structured','text':'每张发票至多关联一个结算单。','expect':{'type':'CARDINALITY_CONSTRAINT','maximum':'1','objects':['发票','结算单']}},
              {'id':'at_least_one','mode':'structured','text':'每张发票至少关联一个结算单。','expect':{'type':'CARDINALITY_CONSTRAINT','minimum':'1','objects':['发票','结算单']}},
              {'id':'formula_compute_as','mode':'structured','text':'退款金额按实付金额减去优惠金额计算。','expect':{'type':'DERIVED_VALUE','formula_tokens':['退款金额','实付金额','优惠金额']}},
              {'id':'formula_multiply','mode':'structured','text':'应付金额为单价乘以数量。','expect':{'type':'DERIVED_VALUE','formula_tokens':['应付金额','单价','数量']}},
              {'id':'only_actor_permission','mode':'compat','text':'仅订单创建人可撤回尚未审批的订单。','expect':{'predicate':'撤回','actor':'订单创建人','object':'订单','condition':'尚未审批'}},
              {'id':'only_if_then','mode':'compat','text':'只有当库存充足时，系统才可发货。','expect':{'predicate':'发货','actor':'系统','condition':'库存充足'}},
              {'id':'exception_prohibition','mode':'compat','text':'除管理员外，其他人不得删除已发货订单。','expect':{'predicate':'删除','modality':'MUST_NOT','object':'订单'}},
              {'id':'temporal_within','mode':'compat','text':'付款成功后24小时内，财务人员必须开具发票。','expect':{'predicate':'开具','actor':'财务人员','object':'发票'}},
              {'id':'relation_belongs_exact_one','mode':'structured','text':'每个订单必须归属于一个组织。','expect':{'objects':['订单','组织']}},
              {'id':'composition_mixed_cardinality','mode':'structured','text':'一个采购订单包含一个订单头和多个订单明细。','expect_pairs':[['采购订单','订单头'],['采购订单','订单明细']]},
              {'id':'false_action_creator_field','mode':'compat','text':'订单创建人字段不得为空。','forbid_predicates':['创建']},
              {'id':'false_action_refund_field','mode':'compat','text':'退款金额不得超过实付金额。','forbid_predicates':['退款']},
              {'id':'false_action_shipping_notice','mode':'compat','text':'发货通知创建人字段由系统维护。','forbid_predicates':['发货','创建']},
              {'id':'cross_sentence_coreference','mode':'compat','text':'订单创建后进入待审批状态。只有创建人可以撤回该订单。若订单已审批，则不得撤回。','expect':{'predicate':'撤回','actor':'创建人','object':'订单'}},
          ]

          def has_tokens(value: Any, tokens: list[str]) -> bool:
              raw = json.dumps(value, ensure_ascii=False, sort_keys=True)
              return all(t in raw for t in tokens)

          results=[]
          for case in CASES:
              try:
                  facts = structured(case['text']) if case['mode']=='structured' else compat(case['text'])
                  accepted = [f for f in facts if text(f.get('status')).upper() in {'','ACCEPTED','CONFIRMED'}]
                  checks=[]
                  exp=case.get('expect') or {}
                  if exp:
                      matches=[]
                      for f in accepted:
                          ok=True
                          if exp.get('type') and text(f.get('fact_type')).upper()!=exp['type']: ok=False
                          if exp.get('predicate') and exp['predicate'] not in text(f.get('predicate')): ok=False
                          if exp.get('actor') and exp['actor'] not in (f.get('actors') or []): ok=False
                          if exp.get('object') and exp['object'] not in [*(f.get('subjects') or []),*(f.get('objects') or [])]: ok=False
                          if exp.get('condition') and not has_tokens(f.get('conditions'),[exp['condition']]): ok=False
                          if exp.get('modality') and text(f.get('modality')).upper()!=exp['modality']: ok=False
                          if exp.get('objects') and not all(o in [*(f.get('subjects') or []),*(f.get('objects') or [])] for o in exp['objects']): ok=False
                          if exp.get('minimum') and not has_tokens(f.get('quantity'),[exp['minimum']]): ok=False
                          if exp.get('maximum') and not has_tokens(f.get('quantity'),[exp['maximum']]): ok=False
                          if exp.get('formula_tokens') and not has_tokens(f.get('formula'),exp['formula_tokens']): ok=False
                          if ok: matches.append(f)
                      checks.append({'kind':'expected_fact','pass':bool(matches),'matches':matches})
                  if case.get('expect_pairs'):
                      present=[]
                      for pair in case['expect_pairs']:
                          found=any(all(o in [*(f.get('subjects') or []),*(f.get('objects') or [])] for o in pair) for f in accepted)
                          present.append({'pair':pair,'pass':found})
                      checks.append({'kind':'expected_pairs','pass':all(x['pass'] for x in present),'pairs':present})
                  forbidden=case.get('forbid_predicates') or []
                  if forbidden:
                      bad=[f for f in accepted if any(p==text(f.get('predicate')) for p in forbidden)]
                      checks.append({'kind':'forbidden_predicates','pass':not bad,'bad':bad})
                  passed=all(c['pass'] for c in checks) if checks else True
                  results.append({'id':case['id'],'mode':case['mode'],'text':case['text'],'pass':passed,'checks':checks,'facts':facts})
              except Exception as exc:
                  results.append({'id':case['id'],'mode':case['mode'],'text':case['text'],'pass':False,'error':f'{type(exc).__name__}: {exc}'})

          report={
              'schema':'qualibug.chinese-explicit-fact-mutation-probe.v1',
              'case_count':len(results),
              'pass_count':sum(1 for r in results if r['pass']),
              'fail_count':sum(1 for r in results if not r['pass']),
              'results':results,
              'product_writeback_allowed':False,
              'probe_used_as_training_ground_truth':False,
          }
          Path('.github/chinese-fact-mutation-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'pass':report['pass_count'],'fail':report['fail_count']},ensure_ascii=False))
          PY
          python /tmp/probe.py
      - name: Commit diagnostic report safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mmc20210220-ctrl"
          git config user.email "mmc20210220@gmail.com"
          git add .github/chinese-fact-mutation-report.json
          git commit -m "test(understanding): publish Chinese fact mutation diagnostics"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
