name: Connector mainline syntax repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connector-mainline.yml"

permissions:
  contents: write

concurrency:
  group: connector-mainline-syntax-repair
  cancel-in-progress: false

jobs:
  repair-python311-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Repair exact incompatible syntax and restore normal workflow
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: exact target count={text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def replace_line_span(
              path: str,
              start_contains: str,
              end_contains: str,
              replacement: list[str],
          ) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if start_contains in line]
              if len(starts) != 1:
                  raise SystemExit(f"{path}: start target count={len(starts)}")
              start = starts[0]
              end = next(
                  (i for i in range(start, len(lines)) if end_contains in lines[i]),
                  None,
              )
              if end is None:
                  raise SystemExit(f"{path}: end target missing")
              rendered = [line if line.endswith("\n") else line + "\n" for line in replacement]
              target.write_text("".join([*lines[:start], *rendered, *lines[end + 1 :]]), encoding="utf-8")

          bom_path = Path("artifacts/spec_v1_6_2_cleanup_reval/_run_reval_scan.py")
          bom_path.write_text(
              bom_path.read_text(encoding="utf-8-sig"),
              encoding="utf-8",
          )

          replace_line_span(
              "ai_test_asset_center/cleanup_execution_receipt.py",
              'receipt_id = f"cleanup_exec_{_sha256_short({',
              '})}"',
              [
                  "    receipt_identity = {",
                  '        "experiment_id": experiment_id,',
                  '        "proof_id": proof_id,',
                  '        "method": method,',
                  '        "materialized_path": materialized_path,',
                  '        "source_receipt_ids": source_ids,',
                  "    }",
                  '    receipt_id = "cleanup_exec_" + _sha256_short(receipt_identity)',
              ],
          )

          replace_one(
              "ai_test_asset_center/phase105_frontend_preview_acceptance.py",
              'f"health status={health["status"]}, service_status={health_data.get(\'status\')}。"',
              'f"health status={health[\'status\']}, service_status={health_data.get(\'status\')}。"',
          )

          replace_line_span(
              "ai_test_asset_center/enterprise_knowledge_center/_linking_impl.py",
              "            edges.append({",
              '})}",',
              [
                  "            edge_identity = {",
                  '                "rule": rule_id,',
                  '                "interface": interface_id,',
                  '                "derivation": "exact_source_section",',
                  "            }",
                  "            edges.append({",
                  '                "edge_id": "edge:" + _short_hash(edge_identity),',
              ],
          )

          targets = [
              bom_path,
              Path("ai_test_asset_center/cleanup_execution_receipt.py"),
              Path("ai_test_asset_center/phase105_frontend_preview_acceptance.py"),
              Path("ai_test_asset_center/enterprise_knowledge_center/_linking_impl.py"),
          ]
          for target in targets:
              ast.parse(target.read_text(encoding="utf-8"), filename=str(target))
          print("all guarded Python 3.11 repairs parsed")
          PY

          git show HEAD^:.github/workflows/connector-mainline.yml > .github/workflows/connector-mainline.yml
          git config user.name "qualibug-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(ci): restore Python 3.11 syntax compatibility"
          git pull --rebase origin main
          git push origin HEAD:main
