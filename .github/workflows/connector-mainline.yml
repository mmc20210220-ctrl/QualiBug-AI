name: Connector mainline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connector-mainline.yml"
      - ".github/lifecycle-root-fix-trigger"
      - "ai_test_asset_center/connector_*.py"
      - "ai_test_asset_center/feishu_connector_adapter.py"
      - "ai_test_asset_center/private_pilot_connector_handlers.py"
      - "ai_test_asset_center/private_pilot_service.py"
      - "tests/test_connector_*.py"
      - "tests/test_private_pilot_connector_handlers.py"
  pull_request:
    paths:
      - ".github/workflows/connector-mainline.yml"
      - "ai_test_asset_center/connector_*.py"
      - "ai_test_asset_center/feishu_connector_adapter.py"
      - "ai_test_asset_center/private_pilot_connector_handlers.py"
      - "ai_test_asset_center/private_pilot_service.py"
      - "tests/test_connector_*.py"
      - "tests/test_private_pilot_connector_handlers.py"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: connector-mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-mainline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile connector authorities
        run: |
          python -m py_compile \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/connector_connection_profiles.py \
            ai_test_asset_center/connector_write_fence.py \
            ai_test_asset_center/connector_sync_fencing.py \
            ai_test_asset_center/connector_sync_ownership.py \
            ai_test_asset_center/connector_checkpoint_recovery.py \
            ai_test_asset_center/connector_configuration_service.py \
            ai_test_asset_center/connector_workspace_maintenance.py \
            ai_test_asset_center/connector_auto_sync.py \
            ai_test_asset_center/private_pilot_connector_handlers.py \
            ai_test_asset_center/private_pilot_service.py
      - name: Run connector mainline regression tests
        run: |
          python -m pytest -q \
            tests/test_connector_auto_sync.py \
            tests/test_connector_auto_sync_recovery_probe.py \
            tests/test_connector_sync_ownership.py \
            tests/test_connector_sync_fencing.py \
            tests/test_connector_configuration_service.py \
            tests/test_connector_workspace_maintenance.py \
            tests/test_connector_workspace_maintenance_security.py \
            tests/test_connector_fencing_public_projection.py \
            tests/test_connector_supervisor_lifecycle_authority.py \
            tests/test_private_pilot_connector_handlers.py \
            tests/test_frontend_materials_mainline.py

  lifecycle-root-delivery:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(lifecycle): deliver verified root fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish lifecycle delivery pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'qualibug/lifecycle-root-delivery',
              description: 'Lifecycle root delivery is validating',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and verify lifecycle root change
        shell: bash
        env:
          PATCH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${PATCH_HEAD_SHA}"
          git show "${PATCH_HEAD_SHA}:.github/delivery/lifecycle-root-fix/patch.b64" > /tmp/lifecycle-root.patch.gz.b64
          echo "05c0bb4e83d3a4a62c1e4b31d3bc461662e1306afe9f94d72d5daca904d05662  /tmp/lifecycle-root.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/lifecycle-root.patch.gz.b64 | gzip -d > /tmp/lifecycle-root.patch
          echo "412a3c39186577fc062f807a819a97890f4517c37651fcb4f658607d67171e5d  /tmp/lifecycle-root.patch" | sha256sum -c -
          git apply --3way --check /tmp/lifecycle-root.patch
          git apply --3way /tmp/lifecycle-root.patch
          git diff --check

      - name: Verify exact lifecycle source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/_experiment_outcome_finalizer_scope_mechanics.py
          ai_test_asset_center/experiment_lifecycle_runtime.py
          ai_test_asset_center/experiment_outcome_finalizer_core.py
          ai_test_asset_center/experiment_plan_step_executor_core.py
          ai_test_asset_center/operational_receipts.py
          ai_test_asset_center/process_step_evidence_scope_audit.py
          ai_test_asset_center/process_step_execution.py
          ai_test_asset_center/process_step_receipt_scope.py
          ai_test_asset_center/process_step_semantic_projection.py
          ai_test_asset_center/process_step_semantic_view.py
          tests/test_experiment_lifecycle_runtime.py
          tests/test_lifecycle_real_http_e2e.py
          tests/test_process_step_execution_semantics.py
          tests/test_process_step_ledger_authority.py
          tests/test_process_step_semantic_view.py
          tests/test_process_step_typed_observer_scope.py
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git rev-parse HEAD > /tmp/tested-base-sha

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lifecycle runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create lifecycle verification command
        shell: bash
        run: |
          cat > /tmp/run-lifecycle-tests.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export QUALIBUG_JWT_SECRET=ci-lifecycle-root-secret
          export QUALIBUG_LOCAL_DEV_ACTOR=1
          export QUALIBUG_ALLOW_PUBLIC_BIND=0
          python -m compileall -q ai_test_asset_center tests
          python -m pytest -q \
            tests/test_experiment_lifecycle_runtime.py \
            tests/test_lifecycle_real_http_e2e.py \
            tests/test_operational_lifecycle_authority.py \
            tests/test_operational_receipts.py \
            tests/test_process_step_execution_semantics.py \
            tests/test_process_step_ledger_authority.py \
            tests/test_process_step_semantic_projection.py \
            tests/test_process_step_semantic_view.py \
            tests/test_process_step_typed_observer_scope.py \
            tests/test_process_step_receipt_scope_runtime.py \
            tests/test_process_step_bundle_hard_gate.py \
            tests/test_process_step_cleanup_status_scope.py \
            tests/test_process_step_oracle_invocation_scope.py \
            tests/test_process_step_oracle_trace_bundle_scope.py \
            tests/test_process_graph_cleanup_bundle_layers.py \
            tests/test_v162_gate_a_receipt_authority.py
          git diff --check
          SH
          chmod +x /tmp/run-lifecycle-tests.sh

      - name: Run lifecycle and real HTTP E2E verification
        run: /tmp/run-lifecycle-tests.sh

      - name: Commit verified lifecycle source and restore connector workflow
        shell: bash
        env:
          PATCH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git show "${PATCH_HEAD_SHA}^:.github/workflows/connector-mainline.yml" > .github/workflows/connector-mainline.yml
          git rm -r .github/delivery/lifecycle-root-fix
          git rm .github/workflows/one-time-lifecycle-root-fix.yml
          git rm .github/lifecycle-root-fix-trigger
          git add -A
          git commit \
            -m 'fix(lifecycle): unify execution facts and terminal reduction' \
            -m 'Separate attempted, executed, accepted and completed step facts; require exact observation, oracle and cleanup scope; make read-only cleanup non-applicable; preserve failed target responses for Oracle evaluation; and derive the terminal lifecycle once from the sealed Execution Receipt Bundle.'

      - name: Rebase, reverify, and push main
        shell: bash
        run: |
          set -euo pipefail
          tested_base="$(cat /tmp/tested-base-sha)"
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          if [[ "${latest_main}" != "${tested_base}" ]]; then
            git rebase origin/main
            /tmp/run-lifecycle-tests.sh
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  publish-lifecycle-root-delivery:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(lifecycle): deliver verified root fix'
    needs: lifecycle-root-delivery
    runs-on: ubuntu-latest
    steps:
      - name: Publish lifecycle delivery status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.lifecycle-root-delivery.result }}';
            const passed = result === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'qualibug/lifecycle-root-delivery',
              description: passed
                ? 'Lifecycle root fix passed and pushed'
                : `Lifecycle root delivery ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  online-source-delivery:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(ingestion): deliver verified online source root fix'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish delivery pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'qualibug/online-source-delivery',
              description: 'Online source delivery is validating',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decode and apply verified root fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/online_source_ingestion_root_fix.patch.gz.b64 \
            | gzip -d > /tmp/online-source-root-fix.patch
          echo '28207a47e62c65d1a6299c36bda8790378bb538125cbabf9ef48055fb031ce9b  /tmp/online-source-root-fix.patch' \
            | sha256sum -c -
          git apply --3way --check /tmp/online-source-root-fix.patch
          git apply --3way /tmp/online-source-root-fix.patch
          git diff --check

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/connector_source_ingestion.py
          ai_test_asset_center/connector_sync_authority.py
          ai_test_asset_center/enterprise_knowledge_center/_crud.py
          ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py
          ai_test_asset_center/enterprise_knowledge_center/source_occurrence_observation.py
          ai_test_asset_center/feishu_connector_adapter.py
          tests/test_feishu_connector_adapter.py
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile online source authorities
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_observation.py \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/feishu_connector_adapter.py

      - name: Run complete online source regression
        env:
          QUALIBUG_JWT_SECRET: ci-online-source-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          python -m pytest -q \
            tests/test_connector_auto_sync.py \
            tests/test_connector_auto_sync_recovery_probe.py \
            tests/test_connector_configuration_service.py \
            tests/test_connector_connection_profiles.py \
            tests/test_connector_fencing_public_projection.py \
            tests/test_connector_profile_transaction_authority.py \
            tests/test_connector_source_ingestion_compatibility.py \
            tests/test_connector_source_occurrence_ingestion.py \
            tests/test_connector_supervisor_lifecycle_authority.py \
            tests/test_connector_sync_authority.py \
            tests/test_connector_sync_fencing.py \
            tests/test_connector_sync_locking.py \
            tests/test_connector_sync_ownership.py \
            tests/test_connector_workspace_maintenance.py \
            tests/test_connector_workspace_maintenance_security.py \
            tests/test_feishu_connector_adapter.py \
            tests/test_frontend_materials_mainline.py \
            tests/test_private_pilot_connector_handlers.py \
            tests/test_source_occurrence_archive_lifecycle.py \
            tests/test_source_occurrence_content_identity.py \
            tests/test_source_occurrence_lifecycle.py \
            tests/test_source_occurrence_projection.py

      - name: Commit verified root fix and restore delivery files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git cat-file blob bd44bc55393855bbe4e99ccac6027f79cb9a5857 \
            > .github/workflows/connector-mainline.yml
          git rm \
            .github/workflows/deliver-online-source-root-fix.yml \
            .github/patches/online_source_ingestion_root_fix.patch.gz.b64 \
            .github/online-source-delivery.trigger \
            ai_test_asset_center/connector_online_source_delivery_trigger.py
          git add \
            .github/workflows/connector-mainline.yml \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_observation.py \
            ai_test_asset_center/feishu_connector_adapter.py \
            tests/test_feishu_connector_adapter.py
          git commit -m 'perf(ingestion): batch and skip unchanged online sources' \
            -m 'Use the existing atomic ingestion, occurrence, observation, coordinator, checkpoint and fencing authorities as one batch. Export only remotely changed Feishu resources, batch-touch unchanged occurrences for full-snapshot deletion safety, preserve precise interpretation identity, and lock the behavior with online-source regressions.'

      - name: Rebase, reverify, and push main
        shell: bash
        env:
          QUALIBUG_JWT_SECRET: ci-online-source-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_observation.py \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/feishu_connector_adapter.py
          python -m pytest -q \
            tests/test_connector_source_ingestion_compatibility.py \
            tests/test_connector_source_occurrence_ingestion.py \
            tests/test_connector_sync_authority.py \
            tests/test_connector_workspace_maintenance_security.py \
            tests/test_feishu_connector_adapter.py \
            tests/test_source_occurrence_archive_lifecycle.py \
            tests/test_source_occurrence_content_identity.py \
            tests/test_source_occurrence_lifecycle.py \
            tests/test_source_occurrence_projection.py
          git push origin HEAD:main

  publish-online-source-delivery:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(ingestion): deliver verified online source root fix'
    needs: online-source-delivery
    runs-on: ubuntu-latest
    steps:
      - name: Publish online source delivery status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.online-source-delivery.result }}';
            const passed = result === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'qualibug/online-source-delivery',
              description: passed
                ? 'Online source root fix passed and pushed'
                : `Online source delivery ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
