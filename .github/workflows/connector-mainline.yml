# registry-refresh: 2026-08-12
name: Connector mainline

on:
  push:
    branches: [main]
    paths:
      - 'tools/.one_shot/qualibug_main_optimization_20260812/**'

permissions:
  contents: write
  statuses: write

concurrency:
  group: qualibug-main-optimization-20260812
  cancel-in-progress: false

jobs:
  deliver-verified-main-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Reassemble and verify optimization patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/.one_shot/qualibug_main_optimization_20260812/part-00 \
            tools/.one_shot/qualibug_main_optimization_20260812/part-01 \
            tools/.one_shot/qualibug_main_optimization_20260812/part-02 \
            tools/.one_shot/qualibug_main_optimization_20260812/part-03 \
            tools/.one_shot/qualibug_main_optimization_20260812/part-04 \
            > /tmp/qualibug-main-optimization.patch
          echo '5a9616483fdbfe15bfdacc3c85bdd6b78ac6329a1111749bc4ced5e1fa8dfa1b  /tmp/qualibug-main-optimization.patch' | sha256sum -c -
          git apply --check /tmp/qualibug-main-optimization.patch
          git apply /tmp/qualibug-main-optimization.patch
          git diff --check

      - name: Verify exact optimization scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/_runtime_binding_graph_mechanics.py
          ai_test_asset_center/_runtime_binding_graph_semantic_mechanics.py
          ai_test_asset_center/behavior_ir_core.py
          ai_test_asset_center/enterprise_knowledge_center/_parsing_mechanics.py
          ai_test_asset_center/obligation_compiler_base.py
          ai_test_asset_center/universal_api_parser.py
          pyproject.toml
          tests/test_effect_observer_source_authority.py
          tests/test_runtime_binding_collection_response_resolver.py
          tests/test_universal_api_parser_content_path_guard.py
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git rev-parse HEAD > /tmp/tested-base-sha

      - name: Compile changed Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            ai_test_asset_center/universal_api_parser.py \
            ai_test_asset_center/enterprise_knowledge_center/_parsing_mechanics.py \
            ai_test_asset_center/_runtime_binding_graph_mechanics.py \
            ai_test_asset_center/_runtime_binding_graph_semantic_mechanics.py \
            ai_test_asset_center/obligation_compiler_base.py \
            ai_test_asset_center/behavior_ir_core.py \
            tests/test_universal_api_parser_content_path_guard.py \
            tests/test_runtime_binding_collection_response_resolver.py \
            tests/test_effect_observer_source_authority.py

      - name: Install package and test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_universal_api_parser_content_path_guard.py \
            tests/test_runtime_binding_collection_response_resolver.py \
            tests/test_effect_observer_source_authority.py \
            tests/test_residue_oracle_semantic_frame_regression.py

      - name: Commit verified optimization and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git cat-file blob f629a6b58ba199a8657d165066af808ef2f6adb4 > .github/workflows/connector-mainline.yml
          git rm -r tools/.one_shot/qualibug_main_optimization_20260812
          git rm .github/workflows/apply-qualibug-main-optimization-20260812.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(core): harden planning and runtime binding' \
            -m 'Accept large compact OpenAPI content safely, reject marker-only semantic rules, restore source-backed runtime identity resolvers and effect observers, keep compensation inference fail-closed, preserve Behavior IR v2 compatibility, and install zstandard for the default artifact compression path.'

      - name: Rebase safely if main moved, re-verify, and push
        shell: bash
        run: |
          set -euo pipefail
          tested_base="$(cat /tmp/tested-base-sha)"
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          if [[ "${latest_main}" != "${tested_base}" ]]; then
            git rebase origin/main
            python -m pytest -q \
              tests/test_universal_api_parser_content_path_guard.py \
              tests/test_runtime_binding_collection_response_resolver.py \
              tests/test_effect_observer_source_authority.py \
              tests/test_residue_oracle_semantic_frame_regression.py
          fi
          git push origin HEAD:main
