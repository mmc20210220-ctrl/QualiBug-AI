name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  role-permission-direct:
    if: github.head_ref == 'role-permission-root-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout role-permission branch
        uses: actions/checkout@v4
        with:
          ref: role-permission-root-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and commit role permission root fix
        run: bash .github/delivery/role-permission-v2/apply.sh

  # BEGIN SINGLE_OBJECT_COMPLEX_DELIVERY
  single-object-complex-direct:
    if: github.head_ref == 'one-shot/single-object-complex-lifecycle'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push single-object complex lifecycle
        run: bash .github/delivery/single-object-complex-main/apply-verified-root-fix.sh
  # END SINGLE_OBJECT_COMPLEX_DELIVERY

  lifecycle-root-dispatch:
    if: github.head_ref == 'automation/lifecycle-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified lifecycle executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-lifecycle-root-fix.yml/dispatches" \
            -f ref=main

  online-source-direct:
    if: github.head_ref == 'online-source-ingestion-root-fix-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm online-source runner
        run: echo online-source-runner-ok
