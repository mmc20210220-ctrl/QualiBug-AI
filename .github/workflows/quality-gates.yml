name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  role-permission-direct:
    if: github.head_ref == 'automation/role-permission-root-cause-delivery-20260801-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push role permission root fix
        run: bash .github/delivery/role-permission/apply-verified-root-fix.sh

  # BEGIN SINGLE_OBJECT_COMPLEX_DELIVERY
  single-object-complex-direct:
    if: github.head_ref == 'one-shot/single-object-complex-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push single-object complex lifecycle
        run: bash .github/delivery/single-object-complex-main/apply-verified-root-fix.sh
  # END SINGLE_OBJECT_COMPLEX_DELIVERY

  lifecycle-root-dispatch:
    if: github.head_ref == 'automation/lifecycle-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified lifecycle executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-lifecycle-root-fix.yml/dispatches" \
            -f ref=main

  online-source-direct:
    if: github.head_ref == 'online-source-ingestion-root-fix-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fixed online-source branch
        uses: actions/checkout@v4
        with:
          ref: online-source-ingestion-root-fix-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Decode and apply immutable verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/online_source_ingestion_root_fix.patch.gz.b64 \
            | gzip -d > /tmp/online-source-root-fix.patch
          echo '1b047903842952c8750440abbe2fb2c38af3e958bcbdd7063b373fb68ba6d079  /tmp/online-source-root-fix.patch' \
            | sha256sum -c -
          git apply --check /tmp/online-source-root-fix.patch
          git apply /tmp/online-source-root-fix.patch
          git diff --check

      - name: Enforce exact product scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/connector_source_ingestion.py
          ai_test_asset_center/connector_sync_authority.py
          ai_test_asset_center/enterprise_knowledge_center/_crud.py
          ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py
          ai_test_asset_center/feishu_connector_adapter.py
          tests/test_feishu_connector_adapter.py
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile online material authorities
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_observation.py \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/feishu_connector_adapter.py

      - name: Run complete enterprise online-material regression
        env:
          QUALIBUG_JWT_SECRET: ci-online-source-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          python -m pytest -q \
            tests/test_connector_auto_sync.py \
            tests/test_connector_auto_sync_recovery_probe.py \
            tests/test_connector_configuration_service.py \
            tests/test_connector_connection_profiles.py \
            tests/test_connector_fencing_public_projection.py \
            tests/test_connector_profile_transaction_authority.py \
            tests/test_connector_source_ingestion_compatibility.py \
            tests/test_connector_source_occurrence_ingestion.py \
            tests/test_connector_supervisor_lifecycle_authority.py \
            tests/test_connector_sync_authority.py \
            tests/test_connector_sync_fencing.py \
            tests/test_connector_sync_locking.py \
            tests/test_connector_sync_ownership.py \
            tests/test_connector_workspace_maintenance.py \
            tests/test_connector_workspace_maintenance_security.py \
            tests/test_feishu_connector_adapter.py \
            tests/test_frontend_materials_mainline.py \
            tests/test_private_pilot_connector_handlers.py \
            tests/test_source_occurrence_archive_lifecycle.py \
            tests/test_source_occurrence_content_identity.py \
            tests/test_source_occurrence_lifecycle.py \
            tests/test_source_occurrence_projection.py

      - name: Commit verified source to PR branch and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git cat-file blob bd44bc55393855bbe4e99ccac6027f79cb9a5857 \
            > .github/workflows/connector-mainline.yml
          git rm \
            .github/workflows/online-source-comment-delivery.yml \
            .github/workflows/online-source-delivery-target.yml \
            .github/workflows/deliver-online-source-root-fix.yml \
            .github/patches/online_source_ingestion_root_fix.patch.gz.b64 \
            .github/online-source-delivery.trigger \
            ai_test_asset_center/connector_online_source_delivery_trigger.py
          git add \
            .github/workflows/connector-mainline.yml \
            ai_test_asset_center/connector_source_ingestion.py \
            ai_test_asset_center/connector_sync_authority.py \
            ai_test_asset_center/enterprise_knowledge_center/_crud.py \
            ai_test_asset_center/enterprise_knowledge_center/source_occurrence_core.py \
            ai_test_asset_center/feishu_connector_adapter.py \
            tests/test_feishu_connector_adapter.py
          git commit -m 'perf(ingestion): batch and skip unchanged online sources' \
            -m 'Reuse the existing atomic ingestion, occurrence, observation, coordinator, checkpoint, and fencing authorities as one batch. Export only remotely changed Feishu resources and preserve full-snapshot deletion safety.'
          git push origin HEAD:online-source-ingestion-root-fix-v2

  correlation-handoff-direct:
    if: github.head_ref == 'delivery/cross-system-correlation-handoff-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and verify immutable correlation patch
        env:
          PATCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${PATCH_HEAD_SHA}"
          git show "${PATCH_HEAD_SHA}:.github/patches/cross-system-correlation-handoff.patch.gz.b64" > /tmp/fixes.b64
          echo 'b23638bc8a94ea864b2bd0db3c795ae15fc1379a5a3eadf8253212abdeeccd09  /tmp/fixes.b64' | sha256sum -c -
          base64 -d /tmp/fixes.b64 | gzip -d > /tmp/fixes.patch
          echo '3d546db2cb1fb0b31a9e7fbe7a86caa42b21f1aa1547def031db84329f52476a  /tmp/fixes.patch' | sha256sum -c -

      - name: Apply to latest main with three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git am --3way /tmp/fixes.patch
          git diff --check HEAD^

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile changed authorities
        run: |
          python -m py_compile \
            ai_test_asset_center/process_graph_wait_contract.py \
            tests/test_process_graph_async_transition_oracle.py \
            tests/test_process_graph_broker_adapter.py \
            tests/test_process_graph_event_transition.py \
            tests/test_process_graph_event_transition_scope.py

      - name: Run cross-system async correlation regressions
        run: |
          python -m pytest -q \
            tests/test_process_graph_event_transition.py \
            tests/test_process_graph_event_transition_scope.py \
            tests/test_process_graph_event_transition_ledger.py \
            tests/test_process_graph_async_transition_oracle.py \
            tests/test_process_graph_broker_delivery.py \
            tests/test_process_graph_broker_adapter.py \
            tests/test_process_graph_broker_oracle.py \
            tests/test_process_graph_wait_outcome.py \
            tests/test_process_graph_wait_source_authority.py \
            tests/test_process_graph_plan_executor.py \
            tests/test_v150_multi_step_protocol.py \
            tests/test_process_graph_dependency_rollback.py \
            tests/test_process_graph_write_rollback_integration.py \
            tests/test_cross_system_process_graph_closure.py \
            tests/test_enterprise_process_graph_ir.py

      - name: Verify exact source and test scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected <<'EOF'
          ai_test_asset_center/process_graph_wait_contract.py
          tests/test_process_graph_async_transition_oracle.py
          tests/test_process_graph_broker_adapter.py
          tests/test_process_graph_event_transition.py
          tests/test_process_graph_event_transition_scope.py
          EOF
          git diff --name-only origin/main...HEAD | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Publish verified source-only branch
        env:
          DELIVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete noop-probe-do-not-create || true
          git push --force-with-lease=refs/heads/delivery/cross-system-correlation-handoff-20260801:${DELIVERY_HEAD_SHA} \
            origin HEAD:delivery/cross-system-correlation-handoff-20260801
