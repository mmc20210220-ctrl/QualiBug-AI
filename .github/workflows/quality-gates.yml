name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  role-permission-dispatch:
    if: github.head_ref == 'automation/role-permission-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified role permission executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-role-permission-root-fix.yml/dispatches" \
            -f ref=main
