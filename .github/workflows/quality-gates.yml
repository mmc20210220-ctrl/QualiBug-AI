name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-contracts:
    name: Backend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Parse modified Python entry points
        run: |
          python -c "import ast; ast.parse(open('core/engine.py').read()); print('core/engine.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/policy_wiring.py').read()); print('policy_wiring.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/policy_registry.py').read()); print('policy_registry.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_campaign.py').read()); print('enterprise_campaign.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_source_registry.py').read()); print('enterprise_source_registry.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/evidence_artifact_store.py').read()); print('evidence_artifact_store.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/browser_execution.py').read()); print('browser_execution.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_test_data_receipts.py').read()); print('enterprise_test_data_receipts.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_test_data_plan.py').read()); print('enterprise_test_data_plan.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/execution_approvals.py').read()); print('execution_approvals.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_access_policy.py').read()); print('enterprise_access_policy.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/change_impact.py').read()); print('change_impact.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/connector_source_ingestion.py').read()); print('connector_source_ingestion.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_delivery_package.py').read()); print('enterprise_delivery_package.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/release_gate.py').read()); print('release_gate.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/__main__.py').read()); print('__main__.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/identity_benchmark_cli.py').read()); print('identity_benchmark_cli.py OK')"
          python -c "import ast; ast.parse(open('backend/main.py').read()); print('backend/main.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/stage_reason_all_v2.py').read()); print('stage_reason_all_v2.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/business_state_graph.py').read()); print('business_state_graph.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/semantic_scenario_generator.py').read()); print('semantic_scenario_generator.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/v12_pipeline.py').read()); print('v12_pipeline.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_compiler_base.py').read()); print('experiment_compiler_base.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_runtime.py').read()); print('process_graph_runtime.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_write_contract.py').read()); print('process_graph_write_contract.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_write_contract_core.py').read()); print('process_graph_write_contract_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_reversibility.py').read()); print('process_graph_reversibility.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_reversibility_core.py').read()); print('process_graph_reversibility_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_rollback_contract.py').read()); print('process_graph_rollback_contract.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_cleanup_executor.py').read()); print('process_graph_cleanup_executor.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_cleanup_executor_core.py').read()); print('process_graph_cleanup_executor_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_cleanup_equivalence.py').read()); print('process_graph_cleanup_equivalence.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/process_graph_cleanup_equivalence_core.py').read()); print('process_graph_cleanup_equivalence_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/cleanup_equivalence.py').read()); print('cleanup_equivalence.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/cleanup_equivalence_core.py').read()); print('cleanup_equivalence_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_plan_executor.py').read()); print('experiment_plan_executor.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_cleanup_lifecycle_adapter.py').read()); print('experiment_cleanup_lifecycle_adapter.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_executor.py').read()); print('experiment_executor.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_executor_governance.py').read()); print('experiment_executor_governance.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/experiment_executor_core.py').read()); print('experiment_executor_core.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_annotation_tasks.py').read()); print('identity_annotation_tasks.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_annotation_operator.py').read()); print('identity_annotation_operator.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_benchmark_regression.py').read()); print('identity_benchmark_regression.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_benchmark_repository.py').read()); print('identity_benchmark_repository.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_benchmark_workflow.py').read()); print('identity_benchmark_workflow.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/private_pilot_identity_benchmark_handlers.py').read()); print('private_pilot_identity_benchmark_handlers.py OK')"
      - name: Run backend and evidence truthfulness gates
        run: |
          python -m pytest \
            tests/test_backend_main_auth.py \
            tests/test_backend_main_enterprise_api.py \
            tests/test_backend_main_access_policy.py \
            tests/test_backend_main_jwt_identity_policy.py \
            tests/test_phase103s_command_center_api.py \
            tests/test_phase104c_api_contract_acceptance.py \
            tests/test_core_engine_evidence_truthfulness.py \
            tests/test_observer_evidence_truthfulness.py \
            tests/test_customer_delivery_gate_v2_cleanup.py \
            tests/test_family_experiment_protocols.py \
            tests/test_typed_observer_authorization.py \
            tests/test_nonproduction_write_contract.py \
            tests/test_behavior_ir_source_relationships.py \
            tests/test_behavior_ir_obligation_experiment.py \
            tests/test_discovery_evaluation_contract.py \
            tests/test_reasoner_hypothesis_guardrail.py \
            tests/test_phase109_incremental_behavior_slices.py \
            tests/test_phase109_behavior_slice_policy_registry.py \
            tests/test_phase110_enterprise_campaign.py \
            tests/test_phase110_unified_scan_contract.py \
            tests/test_phase110_enterprise_source_registry.py \
            tests/test_phase110_evidence_artifact_store.py \
            tests/test_phase110_browser_execution_contract.py \
            tests/test_phase110_test_data_receipts.py \
            tests/test_phase110_execution_approvals.py \
            tests/test_phase110_v12_execution_approval.py \
            tests/test_phase110_scan_execution_approval.py \
            tests/test_phase110_release_gate.py \
            tests/test_phase111_enterprise_access_policy.py \
            tests/test_phase111_change_impact.py \
            tests/test_phase111_connector_source_ingestion.py \
            tests/test_phase111_delivery_package.py \
            tests/test_v150_multi_step_protocol.py \
            tests/test_process_graph_runtime.py \
            tests/test_process_graph_plan_executor.py \
            tests/test_process_graph_write_cleanup.py \
            tests/test_process_graph_write_fail_closed.py \
            tests/test_process_graph_target_preflight.py \
            tests/test_process_graph_rollback_contract.py \
            tests/test_process_graph_write_rollback_integration.py \
            tests/test_process_graph_dependency_rollback.py \
            tests/test_process_graph_multi_write_equivalence.py \
            tests/test_process_graph_cleanup_equivalence_scope.py \
            tests/test_process_graph_environment_receipt_truth.py \
            tests/test_experiment_cleanup_lifecycle_adapter.py \
            tests/test_architecture_extraction_contracts.py \
            tests/test_identity_annotation_tasks.py \
            tests/test_identity_annotation_package_identity.py \
            tests/test_identity_annotation_operator.py \
            tests/test_identity_annotation_http_contract.py \
            tests/test_identity_benchmark_cli.py \
            tests/test_identity_benchmark_regression.py \
            tests/test_identity_benchmark_repository.py \
            tests/test_identity_benchmark_workflow.py \
            tests/test_private_pilot_identity_benchmark_handlers.py \
            tests/test_identity_benchmark_composition_order.py \
            tests/test_identity_benchmark_http_busy_contract.py \
            -q

  frontend-quality:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
