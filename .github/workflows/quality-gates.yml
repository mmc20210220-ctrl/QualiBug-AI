name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Permanent mechanical consumer of the backend contract gate manifest.
  # Runs for EVERY pull request against main; never branch-name gated.
  backend-contract-gate:
    name: Backend contract gate (quality-gates-backend-tests.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run declared backend contract test manifest
        env:
          QUALIBUG_JWT_SECRET: ci-quality-gates-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          set -euo pipefail
          MANIFEST=.github/quality-gates-backend-tests.txt
          GATE_TESTS="$(mktemp)"
          grep -Ev '^[[:space:]]*(#|$)' "$MANIFEST" > "$GATE_TESTS"
          test -s "$GATE_TESTS" || { echo "FATAL: gate manifest is empty"; exit 1; }
          while IFS= read -r t; do
            [ -f "$t" ] || { echo "FATAL: declared gate test missing: $t"; exit 1; }
          done < "$GATE_TESTS"
          echo "Executing $(wc -l < "$GATE_TESTS") declared backend contract tests"
          xargs -a "$GATE_TESTS" python -m pytest -q

  # BEGIN SINGLE_OBJECT_COMPLEX_DELIVERY
  single-object-complex-direct:
    if: github.head_ref == 'one-shot/single-object-complex-lifecycle'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push single-object complex lifecycle
        run: bash .github/delivery/single-object-complex-main/apply-verified-root-fix.sh
  # END SINGLE_OBJECT_COMPLEX_DELIVERY

  lifecycle-root-dispatch:
    if: github.head_ref == 'automation/lifecycle-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified lifecycle executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-lifecycle-root-fix.yml/dispatches" \
            -f ref=main

  sealed-real-benchmark:
    if: github.head_ref == 'eval/real-runtime-20260805'
    name: real-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      QUALIBUG_EVAL_VARIANT: ${{ matrix.variant }}
      QUALIBUG_EVAL_OUT_DIR: ${{ github.workspace }}/_ci_results
      QUALIBUG_REPO_ROOT: ${{ github.workspace }}
      QUALIBUG_BENCHMARK_PROJECT: benchmark_mall
      QUALIBUG_TARGET_BASE_URL: http://127.0.0.1:8080
      QUALIBUG_DB_DSN: postgresql://benchmark_user:benchmark_pass@127.0.0.1:55432/benchmark_mall
      QUALIBUG_BENCHMARK_TARGET_ROOT: ${{ runner.temp }}/benchmark-target
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct isolated benchmark target
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/payload-unpacked" "$RUNNER_TEMP/benchmark-target" "$RUNNER_TEMP/evaluator-private"
          cat _ci_eval/payload.part.* | base64 --decode > "$RUNNER_TEMP/eval-payload.tar.gz"
          echo "f8b28895829727e57b289895013d269b4c1ee2c3a224d04275cbcc3ead902e79  $RUNNER_TEMP/eval-payload.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/eval-payload.tar.gz" -C "$RUNNER_TEMP/payload-unpacked"
          mv "$RUNNER_TEMP/payload-unpacked/eval-assets" "$RUNNER_TEMP/eval-assets"
          echo "675373a73af63d7ad77fc16ec539ec712ec81ef042210d9ae7fc337119c09513  $RUNNER_TEMP/eval-assets/candidate.patch" | sha256sum -c -
          cp -a "$RUNNER_TEMP/eval-assets/benchmark/." "$RUNNER_TEMP/benchmark-target/"
          mv "$RUNNER_TEMP/benchmark-target/hidden_ground_truth" "$RUNNER_TEMP/evaluator-private/"
          cp "$RUNNER_TEMP/benchmark-target/scripts/score_qualibug_output.py" "$RUNNER_TEMP/evaluator-private/"
          rm -f "$RUNNER_TEMP/benchmark-target/scripts/score_qualibug_output.py"
          test ! -e "$RUNNER_TEMP/benchmark-target/hidden_ground_truth"
          test -f "$RUNNER_TEMP/evaluator-private/hidden_ground_truth/bugs.json"

      - name: Verify and apply candidate patch
        if: matrix.variant == 'candidate'
        run: |
          set -euxo pipefail
          git apply --check "$RUNNER_TEMP/eval-assets/candidate.patch"
          git apply "$RUNNER_TEMP/eval-assets/candidate.patch"
          git diff --check
          git diff --stat

      - name: Seal product-visible evaluation inputs
        run: |
          set -euxo pipefail
          rm -f _ci_eval/payload.part.*
          rm -f "$RUNNER_TEMP/eval-payload.tar.gz"
          rm -rf "$RUNNER_TEMP/payload-unpacked" "$RUNNER_TEMP/eval-assets"
          test -z "$(find _ci_eval -maxdepth 1 -name 'payload.part.*' -print -quit)"
          test ! -e "$RUNNER_TEMP/eval-assets"
          test -f "$RUNNER_TEMP/evaluator-private/hidden_ground_truth/bugs.json"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install QualiBug runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,database]'

      - name: Start real benchmark services
        working-directory: ${{ runner.temp }}/benchmark-target
        run: |
          set -euxo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/benchmark-health.json; then
              cat /tmp/benchmark-health.json
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run product scan without ground truth
        run: |
          set -o pipefail
          mkdir -p _ci_results
          python _ci_eval/run_real_benchmark.py 2>&1 | tee "_ci_results/${{ matrix.variant }}.run.log"

      - name: Score after product report is sealed
        if: success()
        run: |
          python "$RUNNER_TEMP/evaluator-private/score_qualibug_output.py" \
            --ground-truth "$RUNNER_TEMP/evaluator-private/hidden_ground_truth/bugs.json" \
            --qualibug-report "_ci_results/${{ matrix.variant }}.report.json" \
            > "_ci_results/${{ matrix.variant }}.external_score.json"
          cat "_ci_results/${{ matrix.variant }}.external_score.json"

      - name: Capture target logs
        if: always()
        working-directory: ${{ runner.temp }}/benchmark-target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_ci_results"
          docker compose ps --all > "$GITHUB_WORKSPACE/_ci_results/${{ matrix.variant }}.docker-ps.txt" || true
          docker compose logs --no-color > "$GITHUB_WORKSPACE/_ci_results/${{ matrix.variant }}.docker.log" 2>&1 || true

      - name: Upload real benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-benchmark-${{ matrix.variant }}
          path: _ci_results/
          if-no-files-found: error
          retention-days: 7

  compare-sealed-real-results:
    name: compare-real-results
    if: always() && github.head_ref == 'eval/real-runtime-20260805'
    needs: sealed-real-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: real-benchmark-*
          path: _comparison
      - name: Build comparison
        run: |
          mkdir -p _ci_results
          python _ci_eval/compare_results.py | tee _ci_results/comparison.log
          cat _ci_results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: real-benchmark-comparison
          path: _ci_results/
          retention-days: 7
