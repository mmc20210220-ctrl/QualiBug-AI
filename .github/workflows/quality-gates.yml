name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Permanent mechanical consumer of the backend contract gate manifest.
  # Runs for EVERY pull request against main; never branch-name gated.
  backend-contract-gate:
    name: Backend contract gate (quality-gates-backend-tests.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run declared backend contract test manifest
        env:
          QUALIBUG_JWT_SECRET: ci-quality-gates-secret
          QUALIBUG_LOCAL_DEV_ACTOR: '1'
          QUALIBUG_ALLOW_PUBLIC_BIND: '0'
        run: |
          set -euo pipefail
          MANIFEST=.github/quality-gates-backend-tests.txt
          GATE_TESTS="$(mktemp)"
          grep -Ev '^[[:space:]]*(#|$)' "$MANIFEST" > "$GATE_TESTS"
          test -s "$GATE_TESTS" || { echo "FATAL: gate manifest is empty"; exit 1; }
          while IFS= read -r t; do
            [ -f "$t" ] || { echo "FATAL: declared gate test missing: $t"; exit 1; }
          done < "$GATE_TESTS"
          echo "Executing $(wc -l < "$GATE_TESTS") declared backend contract tests"
          xargs -a "$GATE_TESTS" python -m pytest -q

  # Permanent frontend gate. Keep this independent of a running backend so the
  # SPA contract can be validated deterministically on every PR.
  frontend-contract-gate:
    name: Frontend type, lint, test and build gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Agent Workspace product contract
        run: npm run test:agent-workspace

      - name: Requirement Intelligence product contract
        run: npm run test:requirement-intelligence

      - name: Production build
        run: npm run build
