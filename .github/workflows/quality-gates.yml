name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # BEGIN SINGLE_OBJECT_COMPLEX_DELIVERY
  single-object-complex-direct:
    if: github.head_ref == 'one-shot/single-object-complex-lifecycle'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push single-object complex lifecycle
        run: bash .github/delivery/single-object-complex-main/apply-verified-root-fix.sh
  # END SINGLE_OBJECT_COMPLEX_DELIVERY

  lifecycle-root-dispatch:
    if: github.head_ref == 'automation/lifecycle-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified lifecycle executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-lifecycle-root-fix.yml/dispatches" \
            -f ref=main

  # BEGIN EXACT_INTERFACE_ROOT_DELIVERY
  exact-interface-root-direct:
    if: github.head_ref == 'automation/exact-interface-root-delivery-20260801-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone latest main without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'

      - name: Verify and apply immutable source change
        working-directory: repo
        run: |
          set -euo pipefail
          payload=.github/delivery/exact-interface-root.patch.gz.b64
          echo '17143372267e104e4fa091ea13880b67557f73e6ca2c0165a342cfdaac9d9477  '"${payload}" | sha256sum -c -
          base64 -d "${payload}" | gzip -d > /tmp/exact-interface-root.patch
          echo 'e40ac9cbbc6b803e09bdf28ebf16d8e6bd79e9507ff4f6b1a42617e8e9df8813  /tmp/exact-interface-root.patch' | sha256sum -c -
          git apply --3way --check /tmp/exact-interface-root.patch
          git apply --3way /tmp/exact-interface-root.patch
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir_governance.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding_governance.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/schema.py
          tests/test_behavior_exact_interface_attachment.py
          EOF
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install product and test dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'

      - name: Compile and run focused regressions
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m compileall -q ai_test_asset_center benchmark_evaluator tests
          python3 -m pytest -q \
            tests/test_behavior_exact_interface_attachment.py \
            tests/test_behavior_implementation_binding_relationships.py \
            tests/test_enterprise_understanding_responsibility_authorization_boundary.py \
            tests/test_enterprise_understanding_authorization_unknown_propagation.py
          git diff --check

      - name: Commit normal source and remove all delivery assets
        working-directory: repo
        run: |
          set -euo pipefail
          rm -f .github/delivery/exact-interface-root.patch.gz.b64
          rm -f .github/workflows/one-time-exact-interface-root-delivery.yml
          rm -f .github/exact-interface-root-delivery.trigger
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/quality-gates.yml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'\n  # BEGIN EXACT_INTERFACE_ROOT_DELIVERY\n.*?\n  # END EXACT_INTERFACE_ROOT_DELIVERY\n?',
              '\n',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'exact interface delivery block count={count}')
          path.write_text(updated.rstrip() + '\n', encoding='utf-8')
          PY
          git add -A
          git diff --cached --check
          git commit -m 'fix(understanding): preserve exact interface and scope identity' \
            -m 'Carry ingestion-authored OpenAPI interface identity through Fact to Behavior evidence, prevent own-scope and tenant-scope behaviors from remerging, and let the existing governed binder consume exact source attachments without fuzzy endpoint selection.'

      - name: Rebase, reverify, and push main
        working-directory: repo
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]]; then
            git rebase origin/main
            python3 -m compileall -q ai_test_asset_center benchmark_evaluator tests
            python3 -m pytest -q \
              tests/test_behavior_exact_interface_attachment.py \
              tests/test_behavior_implementation_binding_relationships.py \
              tests/test_enterprise_understanding_responsibility_authorization_boundary.py \
              tests/test_enterprise_understanding_authorization_unknown_propagation.py
            git diff --check
          fi
          git push origin HEAD:main
  # END EXACT_INTERFACE_ROOT_DELIVERY
