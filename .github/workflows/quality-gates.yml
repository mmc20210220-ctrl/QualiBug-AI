name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-contracts:
    name: Backend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Parse modified Python entry points
        run: |
          python -c "import ast; ast.parse(open('core/engine.py').read()); print('core/engine.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/policy_wiring.py').read()); print('policy_wiring.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/policy_registry.py').read()); print('policy_registry.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_campaign.py').read()); print('enterprise_campaign.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_source_registry.py').read()); print('enterprise_source_registry.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/evidence_artifact_store.py').read()); print('evidence_artifact_store.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/browser_execution.py').read()); print('browser_execution.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_test_data_receipts.py').read()); print('enterprise_test_data_receipts.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_test_data_plan.py').read()); print('enterprise_test_data_plan.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/execution_approvals.py').read()); print('execution_approvals.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/release_gate.py').read()); print('release_gate.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/__main__.py').read()); print('__main__.py OK')"
          python -c "import ast; ast.parse(open('backend/main.py').read()); print('backend/main.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/stage_reason_all_v2.py').read()); print('stage_reason_all_v2.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/business_state_graph.py').read()); print('business_state_graph.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/semantic_scenario_generator.py').read()); print('semantic_scenario_generator.py OK')"
          python -c "import ast; ast.parse(open('ai_test_asset_center/v12_pipeline.py').read()); print('v12_pipeline.py OK')"
      - name: Run backend and evidence truthfulness gates
        run: |
          python -m pytest \
            tests/test_backend_main_auth.py \
            tests/test_phase103s_command_center_api.py \
            tests/test_phase104c_api_contract_acceptance.py \
            tests/test_core_engine_evidence_truthfulness.py \
            tests/test_reasoner_hypothesis_guardrail.py \
            tests/test_phase109_incremental_behavior_slices.py \
            tests/test_phase109_behavior_slice_policy_registry.py \
            tests/test_phase110_enterprise_campaign.py \
            tests/test_phase110_unified_scan_contract.py \
            tests/test_phase110_enterprise_source_registry.py \
            tests/test_phase110_evidence_artifact_store.py \
            tests/test_phase110_browser_execution_contract.py \
            tests/test_phase110_test_data_receipts.py \
            tests/test_phase110_execution_approvals.py \
            tests/test_phase110_release_gate.py \
            -q

  frontend-quality:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
