name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: verified-root-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  identity-table-dispatch:
    if: github.head_ref == 'internal-identity-table-quality-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact table semantic identity executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-role-permission-root-fix.yml/dispatches" \
            -f ref=main

  role-permission-direct:
    if: github.head_ref == 'automation/role-permission-root-cause-delivery-20260801-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply, verify, test and push role permission root fix
        run: bash .github/delivery/role-permission/apply-verified-root-fix.sh

  lifecycle-root-dispatch:
    if: github.head_ref == 'automation/lifecycle-root-cause-delivery-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified lifecycle executor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/workflows/one-time-lifecycle-root-fix.yml/dispatches" \
            -f ref=main
