name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  backend-contracts:
    name: Backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Syntax check Python files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          failures = []
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git', '.venv', 'venv', '__pycache__'} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Python syntax check passed')
          PY
      - name: Validate backend test manifest
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          manifest = Path('.github/quality-gates-backend-tests.txt')
          if not manifest.is_file():
              raise SystemExit('backend test manifest missing')
          entries = [
              line.strip()
              for line in manifest.read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          duplicates = sorted(
              path for path, count in Counter(entries).items() if count > 1
          )
          missing = sorted(path for path in entries if not Path(path).is_file())
          invalid = sorted(
              path
              for path in entries
              if not path.startswith('tests/test_') or not path.endswith('.py')
          )
          issues = []
          if not entries:
              issues.append('backend test manifest is empty')
          if duplicates:
              issues.append('duplicate tests: ' + ', '.join(duplicates))
          if missing:
              issues.append('missing tests: ' + ', '.join(missing))
          if invalid:
              issues.append('invalid test paths: ' + ', '.join(invalid))
          if issues:
              raise SystemExit('\n'.join(issues))
          print(f'Backend test manifest valid: {len(entries)} files')
          PY
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend, guardrail, and evidence truthfulness gates
        run: |
          mapfile -t test_files < <(
            grep -Ev '^[[:space:]]*(#|$)' \
              .github/quality-gates-backend-tests.txt
          )
          python -m pytest "${test_files[@]}" -q

  frontend-quality:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  publish-status:
    name: Publish quality gates status
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - backend-contracts
      - frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Publish legacy commit status
        uses: actions/github-script@v7
        with:
          script: |
            const backend = '${{ needs.backend-contracts.result }}';
            const frontend = '${{ needs.frontend-quality.result }}';
            const results = [backend, frontend];
            const failed = results.some((value) => value === 'failure');
            const passed = results.every((value) => value === 'success');
            if (!passed && !failed) {
              core.notice(
                `Quality gates not terminally classifiable: backend=${backend}, frontend=${frontend}; no pass/fail status published`
              );
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'qualibug/quality-gates',
              description: passed
                ? 'Backend and frontend quality gates passed'
                : 'Backend or frontend quality gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });