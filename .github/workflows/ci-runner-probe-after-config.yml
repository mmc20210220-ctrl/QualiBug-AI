name: Runner Probe After Config

on:
  push:
    branches: ["eval/real-runtime-20260805"]
    paths:
      - ".github/workflows/ci-runner-probe-after-config.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-runner-probe-after-config.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enter runner
        run: echo RUNNER_OK
