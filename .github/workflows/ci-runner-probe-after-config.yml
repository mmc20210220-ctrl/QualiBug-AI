name: Runner Probe After Config

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-runner-probe-after-config.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enter runner
        run: echo RUNNER_OK
