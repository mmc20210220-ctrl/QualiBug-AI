name: One-time verified API contract delivery

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  statuses: write

concurrency:
  group: one-time-api-contract-actorless-delivery
  cancel-in-progress: true

jobs:
  deliver:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.ref == 'delivery/api-contract-actorless-trigger-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'qualibug/api-contract-actorless-delivery',
              description: 'API contract and preauthenticated runtime are validating',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify immutable patch
        shell: bash
        run: |
          set -euo pipefail
          payload_ref='delivery/api-contract-actorless-20260805'
          root='.github/delivery/api-contract-actorless'
          git fetch origin "${payload_ref}"
          : > /tmp/api-contract-actorless.b64
          for part in 00 01 02 03 04; do
            git show "origin/${payload_ref}:${root}/chunk-${part}.b64" >> /tmp/api-contract-actorless.b64
          done
          git show "origin/${payload_ref}:${root}/part-02.b64" >> /tmp/api-contract-actorless.b64
          git show "origin/${payload_ref}:${root}/part-03.b64" >> /tmp/api-contract-actorless.b64
          echo '4a43acb66f59428cdb564029356c7de514b33b361220b09ceefde01b61f37c41  /tmp/api-contract-actorless.b64' | sha256sum -c -
          base64 --decode /tmp/api-contract-actorless.b64 | gzip --decompress > /tmp/api-contract-actorless.patch
          echo 'd3af138b1d088022772da23acf09c9c40d91a74f176d781bf2941e3ecf281ff6  /tmp/api-contract-actorless.patch' | sha256sum -c -
          git rev-parse HEAD > /tmp/tested-base-sha
          git apply --3way --check /tmp/api-contract-actorless.patch
          git apply --3way /tmp/api-contract-actorless.patch
          git diff --check

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/_parsing.py
          ai_test_asset_center/experiment_runtime_credentials.py
          ai_test_asset_center/scan_source_runtime.py
          ai_test_asset_center/semantic_scenario_generator/_generator.py
          ai_test_asset_center/universal_api_parser.py
          projects/benchmark_mall/input/API_SPEC.md
          tests/test_actor_permission_guard.py
          tests/test_discovery_mainline_coordinator.py
          tests/test_markdown_request_schema.py
          tests/test_stale_credential_and_reason_honesty.py
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused clean-checkout regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python -m compileall -q ai_test_asset_center tests
          python -m pytest -q \
            tests/test_actor_permission_guard.py \
            tests/test_discovery_mainline_coordinator.py \
            tests/test_markdown_request_schema.py \
            tests/test_stale_credential_and_reason_honesty.py
          git diff --check

      - name: Commit final source tree and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git checkout 8c3e8c26da3b1d699894dd34b926602b3c12701b -- .github/workflows/one-time-single-object-complex-delivery.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(runtime): complete benchmark API contract and support preauthenticated execution' \
            -m 'Document all 101 benchmark-mall business routes, preserve required fields, foreign keys and role constraints, load project-scoped database schemas, avoid treating large inline OpenAPI JSON as a filesystem path, improve sibling identity binding, and allow declared preauthenticated bearer contexts to bypass unavailable login endpoints while remaining fail-closed for missing or expired tokens.'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              export PYTHONPATH=.
              python -m pytest -q \
                tests/test_actor_permission_guard.py \
                tests/test_discovery_mainline_coordinator.py \
                tests/test_markdown_request_schema.py \
                tests/test_stale_credential_and_reason_honesty.py
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

  publish:
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.ref == 'delivery/api-contract-actorless-trigger-20260805'
    needs: deliver
    runs-on: ubuntu-latest
    steps:
      - name: Publish delivery result
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.deliver.result }}';
            const passed = result === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? 'success' : 'failure',
              context: 'qualibug/api-contract-actorless-delivery',
              description: passed
                ? 'API contract and preauthenticated runtime passed and pushed'
                : `API contract delivery ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
