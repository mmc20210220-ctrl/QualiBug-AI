name: UI upload fixture governance

on:
  push:
    branches: [main]
    paths:
      - 'ai_test_asset_center/ui_upload_fixture_*.py'
      - 'ai_test_asset_center/ui_upload_scenario_*.py'
      - 'ai_test_asset_center/private_pilot_upload_fixture_*.py'
      - 'ai_test_asset_center/private_pilot_ui_upload_scenario_*.py'
      - 'ai_test_asset_center/private_pilot_scan_context_patch.py'
      - 'ai_test_asset_center/scan_ui_source_registry_guard.py'
      - 'ai_test_asset_center/visual_baseline_registry.py'
      - 'frontend/src/api/upload-fixtures.ts'
      - 'frontend/src/api/ui-upload-scenarios.ts'
      - 'frontend/src/api/run-center.ts'
      - 'frontend/src/components/run/RunUploadFixtureSelector.tsx'
      - 'frontend/src/components/run/RunUploadScenarioSelector.tsx'
      - 'frontend/src/components/settings/SettingsUploadFixtureSection.tsx'
      - 'frontend/src/components/settings/SettingsUploadScenarioSection.tsx'
      - 'frontend/src/components/settings/SettingsComplexInteractionSection.tsx'
      - 'frontend/src/components/settings/SettingsInfoSection.tsx'
      - 'frontend/src/pages/EnterpriseCampaigns.tsx'
      - 'frontend/src/styles/upload-fixture-settings.css'
      - 'frontend/src/styles/run-upload-fixtures.css'
      - 'tests/test_ui_upload_fixture_*.py'
      - 'tests/test_ui_upload_scenario_*.py'
      - 'tests/test_private_pilot_upload_fixture_*.py'
      - 'tests/test_private_pilot_ui_upload_scenario_*.py'
      - 'tests/test_scan_ui_source_registry_guard.py'
      - 'tests/test_formal_ui_contract_document_guard.py'
      - '.github/workflows/ui-upload-fixture-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-upload-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run upload fixture, scenario and source-authority tests
        run: >-
          python -m pytest -q
          tests/test_ui_upload_fixture_registry.py
          tests/test_ui_upload_fixture_registry_integrity.py
          tests/test_ui_upload_fixture_continuous_binding.py
          tests/test_ui_upload_scenario_registry.py
          tests/test_ui_upload_scenario_semantic_drift.py
          tests/test_private_pilot_upload_fixture_governance.py
          tests/test_private_pilot_upload_fixture_scan_gate.py
          tests/test_private_pilot_ui_upload_scenario_governance.py
          tests/test_scan_ui_source_registry_guard.py
          tests/test_formal_ui_contract_document_guard.py

  playwright-upload-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install playwright
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run governed upload browser acceptance
        run: python -m pytest -q tests/test_ui_upload_fixture_playwright_e2e.py

  frontend-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck fixture and scenario governance UI
        run: npm run typecheck
      - name: Lint fixture and scenario governance UI
        run: npm run lint
