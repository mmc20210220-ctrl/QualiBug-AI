name: One-time identity table diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  benchmark-current-main:
    if: github.head_ref == 'internal-identity-table-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run identity benchmark twice
        shell: bash
        run: |
          cat > /tmp/identity_diagnostic.py <<'PY'
          import json
          from pathlib import Path
          from ai_test_asset_center.enterprise_knowledge_center.composition import build_enterprise_business_knowledge_asset

          def summary(asset):
              model = asset.get('enterprise_understanding_model') or {}
              resolution = asset.get('enterprise_identity_resolution') or {}
              gate = asset.get('enterprise_identity_gate') or model.get('identity_gate') or model.get('gate') or {}
              clusters = resolution.get('clusters') or []
              bindings = model.get('identity_bindings') or []
              unknowns = model.get('identity_unknowns') or []
              unresolved = [
                  item
                  for row in unknowns
                  for item in (row.get('details') or {}).get('unresolved_artifacts') or []
                  if isinstance(item, dict)
              ]
              return {
                  'gate': gate.get('status'),
                  'cluster_count': len(clusters),
                  'cluster_labels': sorted(row.get('canonical_label') for row in clusters if row.get('canonical_label')),
                  'binding_count': len(bindings),
                  'api_bindings': sorted(row.get('artifact_ref') for row in bindings if row.get('artifact_type') == 'API_OPERATION'),
                  'table_bindings': sorted(row.get('artifact_ref') for row in bindings if row.get('artifact_type') == 'DATABASE_TABLE'),
                  'unknown_record_count': len(unknowns),
                  'unresolved_tables': sorted(item.get('artifact_ref') for item in unresolved if item.get('artifact_type') == 'DATABASE_TABLE'),
                  'unresolved_apis': sorted(item.get('artifact_ref') for item in unresolved if item.get('artifact_type') == 'API_OPERATION'),
                  'entity_ids': sorted(row.get('entity_id') for row in clusters if row.get('entity_id')),
              }

          runs = []
          for _ in range(2):
              asset = build_enterprise_business_knowledge_asset('benchmark_mall', Path.cwd(), {'probe_limit': 0})
              runs.append(summary(asset))
          print('IDENTITY_DIAGNOSTIC=' + json.dumps({
              'run1': {key: value for key, value in runs[0].items() if key != 'entity_ids'},
              'run2': {key: value for key, value in runs[1].items() if key != 'entity_ids'},
              'stable_entity_ids': runs[0]['entity_ids'] == runs[1]['entity_ids'],
          }, ensure_ascii=False, sort_keys=True))
          PY
          python /tmp/identity_diagnostic.py
