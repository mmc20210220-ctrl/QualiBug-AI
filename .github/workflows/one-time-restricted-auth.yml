name: One-time restricted-account auth fix
on:
  push:
    branches: [main]
    paths:
      - '.github/delivery/restricted-auth/**'
      - '.github/workflows/one-time-restricted-auth.yml'
permissions:
  contents: write
jobs:
  deliver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cat .github/delivery/restricted-auth/run-* > /tmp/run.sh && bash /tmp/run.sh
