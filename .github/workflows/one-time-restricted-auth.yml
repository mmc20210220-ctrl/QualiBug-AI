name: One-time restricted-account auth fix
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restricted-auth-trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restricted-account-auth-fix
  cancel-in-progress: true
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified patch and deliver
        run: cat .github/delivery/restricted-auth/run-* > /tmp/run.sh && bash /tmp/run.sh
