name: Database model ingestion closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/enterprise_material_formats.py"
      - "ai_test_asset_center/enterprise_knowledge_center/document_ingestion/database_model_adapter.py"
      - "ai_test_asset_center/enterprise_knowledge_center/document_ingestion/planner.py"
      - "ai_test_asset_center/enterprise_knowledge_center/document_ingestion/registry.py"
      - "tests/test_database_model_document_adapter.py"
      - ".github/workflows/database-model-ingestion-closure.yml"

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile database model stages
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_material_formats.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/database_model_adapter.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/planner.py \
            ai_test_asset_center/enterprise_knowledge_center/document_ingestion/registry.py

      - name: Run database model closure tests
        run: |
          pytest -q tests/test_database_model_document_adapter.py
