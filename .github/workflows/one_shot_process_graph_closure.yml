name: One-shot process graph closure

on:
  push:
    paths:
      - .github/workflows/one_shot_process_graph_closure.yml

permissions:
  contents: write

jobs:
  wire-process-graph-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch unique closure boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/closure.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def unique_index(predicate, label):
              matches = [index for index, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one match, found {len(matches)}')
              return matches[0]

          if 'from .process_graph_ir import build_business_process_graphs' not in lines:
              import_index = unique_index(
                  lambda line: line == 'from .schema import (',
                  'schema import boundary',
              )
              lines.insert(import_index, 'from .process_graph_ir import build_business_process_graphs')

          projection_start = unique_index(
              lambda line: line == '    _project_implementation_binding_asset(',
              'implementation projection start',
          )
          projection_end = next(
              (
                  index
                  for index in range(projection_start + 1, len(lines))
                  if lines[index] == '    )'
              ),
              None,
          )
          if projection_end is None:
              raise SystemExit('implementation projection end not found')
          if not any('process_graphs, process_graph_unknowns' in line for line in lines):
              block = '''

    process_graphs, process_graph_unknowns, process_graph_gate = (
        build_business_process_graphs(model, behaviors, implementation_bindings)
    )
    model["process_graphs"] = process_graphs
    model["process_graph_unknowns"] = process_graph_unknowns
    model["process_graph_gate"] = process_graph_gate
    model["business_behavior_ir"] = {
        "schema": "qualibug.enterprise-business-behavior-ir.v1",
        "behaviors": behaviors,
        "process_graphs": process_graphs,
        "behavior_gate": behavior_gate,
        "process_graph_gate": process_graph_gate,
        "semantic_authority": "enterprise_understanding",
        "runtime_executability_claimed": False,
    }
    asset["business_process_graphs"] = process_graphs
    asset["business_process_graph_gate"] = process_graph_gate
    process_graph_metrics = as_dict(process_graph_gate.get("metrics"))
    asset_summary = as_dict(asset.get("summary"))
    asset_summary.update(
        {
            "process_graph_status": process_graph_gate.get("status"),
            "process_graph_count": len(process_graphs),
            "compiled_process_graph_count": int(
                process_graph_metrics.get("compiled_process_graph_count") or 0
            ),
            "partial_process_graph_count": int(
                process_graph_metrics.get("partial_process_graph_count") or 0
            ),
            "process_graph_unknown_count": len(process_graph_unknowns),
        }
    )
    asset["summary"] = asset_summary
    asset_gaps = [
        dict(row)
        for row in as_list(asset.get("coverage_gaps"))
        if isinstance(row, dict) and text(row.get("kind")) != "PROCESS_GRAPH_IR_PARTIAL"
    ]
    if text(process_graph_gate.get("status")) != "PASS":
        asset_gaps.append(
            {
                "kind": "PROCESS_GRAPH_IR_PARTIAL",
                "gap_type": "understood_process_not_fully_bound_to_behavior_implementation",
                "source_id": "*",
                "process_graph_status": process_graph_gate.get("status"),
                "unknown_count": len(process_graph_unknowns),
                "semantic_understanding_is_not_changed": True,
                "runtime_executability_claimed": False,
            }
        )
    asset["coverage_gaps"] = asset_gaps
'''.splitlines()
              lines[projection_end + 1:projection_end + 1] = block

          comment_index = unique_index(
              lambda line: line.startswith('    # Semantic understanding and implementation binding'),
              'semantic gate comment',
          )
          unknown_start = next(
              index
              for index in range(comment_index, len(lines))
              if lines[index] == '    unknowns = ['
          )
          unknown_end = next(
              index
              for index in range(unknown_start + 1, len(lines))
              if lines[index] == '    ]'
          )
          lines[unknown_start:unknown_end + 1] = '''    unknowns = [
        row
        for row in [
            *as_list(model.get("unknowns")),
            *behavior_unknowns,
            *process_graph_unknowns,
        ]
        if isinstance(row, dict)
    ]'''.splitlines()

          behavior_evidence_start = unique_index(
              lambda line: line == '    behavior_evidence = dedupe_evidence(',
              'behavior evidence start',
          )
          model_evidence_start = next(
              index
              for index in range(behavior_evidence_start, len(lines))
              if lines[index] == '    model["evidence_index"] = dedupe_evidence('
          )
          if not any(line == '    process_graph_evidence = dedupe_evidence(' for line in lines):
              process_evidence = '''    process_graph_evidence = dedupe_evidence(
        [
            evidence
            for graph in process_graphs
            for evidence in as_list(graph.get("evidence"))
            if isinstance(evidence, dict)
        ]
    )'''.splitlines()
              lines[model_evidence_start:model_evidence_start] = process_evidence
              model_evidence_start += len(process_evidence)
          compact_evidence = '        [*as_list(model.get("evidence_index")), *behavior_evidence]'
          if compact_evidence in lines:
              compact_index = lines.index(compact_evidence)
              lines[compact_index:compact_index + 1] = '''        [
            *as_list(model.get("evidence_index")),
            *behavior_evidence,
            *process_graph_evidence,
        ]'''.splitlines()
          elif not any('*process_graph_evidence' in line for line in lines):
              raise SystemExit('model evidence projection anchor not found')

          summary_anchor = unique_index(
              lambda line: line.strip() == '"implementation_binding_status": implementation_gate.get("status"),',
              'source summary implementation status',
          )
          if not any('"process_graph_status": process_graph_gate.get("status")' in line for line in lines[summary_anchor:summary_anchor + 20]):
              summary_lines = '''        "process_graph_count": len(process_graphs),
        "compiled_process_graph_count": int(
            process_graph_metrics.get("compiled_process_graph_count") or 0
        ),
        "partial_process_graph_count": int(
            process_graph_metrics.get("partial_process_graph_count") or 0
        ),
        "process_graph_unknown_count": len(process_graph_unknowns),
        "process_graph_status": process_graph_gate.get("status"),'''.splitlines()
              lines[summary_anchor + 1:summary_anchor + 1] = summary_lines

          scenario_metric = unique_index(
              lambda line: line == '    model["metrics"]["scenario_ready_binding_count"] = int(',
              'scenario metric start',
          )
          scenario_end = next(
              index
              for index in range(scenario_metric + 1, len(lines))
              if lines[index] == '    )'
          )
          if not any('model["metrics"]["process_graph_status"]' in line for line in lines):
              metric_lines = '''    model["metrics"]["process_graph_status"] = process_graph_gate.get("status")
    model["metrics"]["compiled_process_graph_count"] = int(
        process_graph_metrics.get("compiled_process_graph_count") or 0
    )
    model["metrics"]["partial_process_graph_count"] = int(
        process_graph_metrics.get("partial_process_graph_count") or 0
    )'''.splitlines()
              lines[scenario_end + 1:scenario_end + 1] = metric_lines

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate syntax and focused behavior
        run: |
          python -m py_compile \
            ai_test_asset_center/multi_step_protocol.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/process_graph_ir.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/closure.py \
            tests/test_v150_multi_step_protocol.py \
            tests/test_enterprise_process_graph_ir.py
          python -m pytest -q \
            tests/test_v150_multi_step_protocol.py \
            tests/test_enterprise_process_graph_ir.py

      - name: Commit validated closure and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one_shot_process_graph_closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/closure.py
          git add .github/workflows/one_shot_process_graph_closure.yml
          git commit -m "feat(understanding): carry process graphs into behavior IR"
          git pull --rebase origin main
          git push origin HEAD:main
