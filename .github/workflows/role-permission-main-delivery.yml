name: Role permission main delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/role-permission-main-delivery.trigger'

permissions:
  contents: write

concurrency:
  group: role-permission-main-delivery
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply verified role permission root fix
        run: bash .github/delivery/role-permission-v2/apply.sh
