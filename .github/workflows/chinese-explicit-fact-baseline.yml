name: Chinese explicit fact baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/enterprise_knowledge_center/**"
      - "benchmark_evaluator/enterprise_understanding/**"
      - "tests/test_enterprise_understanding_chinese_explicit_fact_baseline.py"
      - "tests/test_enterprise_understanding_explicit_fact_bug_dependency.py"
      - "tests/test_enterprise_understanding_explicit_fact_commit_status.py"
      - "tests/test_enterprise_understanding_ground_truth_quarantine.py"
      - "tests/test_enterprise_understanding_fact_probe_policy.py"
      - "tests/test_enterprise_understanding_fact_slot_document.py"
      - "tests/test_enterprise_understanding_fact_slots.py"
      - "tests/test_enterprise_understanding_fact_slot_report.py"
      - "tests/test_enterprise_understanding_post_compile_governance.py"
      - "tests/test_enterprise_understanding_public_import_contract.py"
      - "tests/test_enterprise_understanding_typed_fact_authority.py"
      - "tests/test_enterprise_understanding_typed_relation_projection.py"
      - "tests/test_enterprise_understanding_implicit_rule_*.py"
      - "tests/test_enterprise_understanding_versioned_product_snapshot.py"
      - "tests/test_implicit_rule_*.py"
      - ".github/workflows/chinese-explicit-fact-baseline.yml"
      - "pyproject.toml"

permissions:
  contents: read
  statuses: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Publish pending explicit fact status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "qualibug/chinese-explicit-fact-baseline",
              description: "running isolated Chinese explicit fact baseline",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install product and evaluator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile baseline authorities
        run: |
          python -m compileall -q \
            ai_test_asset_center/enterprise_knowledge_center \
            benchmark_evaluator/enterprise_understanding

      - name: Run focused evaluator contracts
        run: |
          pytest -q \
            tests/test_enterprise_understanding_chinese_explicit_fact_baseline.py \
            tests/test_enterprise_understanding_explicit_fact_bug_dependency.py \
            tests/test_enterprise_understanding_explicit_fact_commit_status.py \
            tests/test_enterprise_understanding_ground_truth_quarantine.py \
            tests/test_enterprise_understanding_fact_probe_policy.py \
            tests/test_enterprise_understanding_fact_slot_document.py \
            tests/test_enterprise_understanding_fact_slots.py \
            tests/test_enterprise_understanding_fact_slot_report.py \
            tests/test_enterprise_understanding_post_compile_governance.py \
            tests/test_enterprise_understanding_public_import_contract.py \
            tests/test_enterprise_understanding_typed_fact_authority.py \
            tests/test_enterprise_understanding_typed_relation_projection.py \
            tests/test_enterprise_understanding_implicit_rule_*.py \
            tests/test_enterprise_understanding_versioned_product_snapshot.py \
            tests/test_implicit_rule_*.py

      - name: Run isolated explicit fact baseline
        id: explicit_fact_baseline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m benchmark_evaluator.enterprise_understanding.chinese_explicit_fact_baseline \
            --workspace-root "$RUNNER_TEMP/chinese-explicit-fact-workspace" \
            --output "$RUNNER_TEMP/chinese-explicit-fact-result"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish explicit fact Bug dependency analysis
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          measurement="$RUNNER_TEMP/chinese-explicit-fact-result/evaluation/business_fact_slot_measurement.json"
          output="$RUNNER_TEMP/chinese-explicit-fact-result/evaluation/explicit_fact_bug_dependency_analysis.json"
          if [ -f "$measurement" ]; then
            python -m benchmark_evaluator.enterprise_understanding.explicit_fact_bug_dependency \
              --ground-truth benchmark_evaluator/enterprise_understanding/fixtures/chinese_explicit_fact_baseline_v1/ground_truth.json \
              --measurement "$measurement" \
              --output "$output"
          fi

      - name: Publish final explicit fact status
        if: always()
        uses: actions/github-script@v7
        env:
          BASELINE_EXIT_CODE: ${{ steps.explicit_fact_baseline.outputs.exit_code }}
          BASELINE_SUMMARY_PATH: ${{ runner.temp }}/chinese-explicit-fact-result/chinese_explicit_fact_baseline_summary.json
        with:
          script: |
            const fs = require("fs");
            const exitCode = Number.parseInt(process.env.BASELINE_EXIT_CODE || "2", 10);
            let summary = {};
            try {
              summary = JSON.parse(
                fs.readFileSync(process.env.BASELINE_SUMMARY_PATH, "utf8")
              );
            } catch (_error) {
              summary = {};
            }
            const metrics = summary.metrics || {};
            const formatMetric = (value) => {
              const number = Number(value);
              return Number.isFinite(number) ? number.toFixed(3) : "n/a";
            };
            const fallbackStatus =
              exitCode === 0 ? "PASS" : exitCode === 3 ? "BELOW_TARGET" : "BLOCKED";
            const resultStatus = String(summary.status || fallbackStatus).toUpperCase();
            const state = exitCode === 0 ? "success" : exitCode === 3 ? "failure" : "error";
            const falseAccepted = Number.isFinite(Number(metrics.false_accepted_fact_count))
              ? Number(metrics.false_accepted_fact_count)
              : "n/a";
            const loss = summary.highest_impact_first_loss
              ? ` loss=${summary.highest_impact_first_loss}`
              : "";
            const description = (
              `${resultStatus} recall=${formatMetric(metrics.fact_recall)}` +
              ` slots=${formatMetric(metrics.slot_exact_accuracy)}` +
              ` p0=${formatMetric(metrics.p0_exact_fact_recall)}` +
              ` evidence=${formatMetric(metrics.source_locator_exact_accuracy)}` +
              ` precision=${formatMetric(metrics.accepted_fact_precision)}` +
              ` false=${falseAccepted}` +
              loss
            ).slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "qualibug/chinese-explicit-fact-baseline",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish pending implicit rule status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "qualibug/implicit-rule-baseline",
              description: "running isolated versioned implicit rule baseline",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Run isolated versioned implicit rule baseline
        id: implicit_rule_baseline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m benchmark_evaluator.enterprise_understanding.implicit_rule_baseline \
            --workspace-root "$RUNNER_TEMP/implicit-rule-workspace" \
            --output "$RUNNER_TEMP/implicit-rule-result"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish final implicit rule status
        if: always()
        uses: actions/github-script@v7
        env:
          BASELINE_EXIT_CODE: ${{ steps.implicit_rule_baseline.outputs.exit_code }}
          BASELINE_SUMMARY_PATH: ${{ runner.temp }}/implicit-rule-result/implicit_rule_baseline_summary.json
        with:
          script: |
            const fs = require("fs");
            const exitCode = Number.parseInt(process.env.BASELINE_EXIT_CODE || "2", 10);
            let summary = {};
            try {
              summary = JSON.parse(
                fs.readFileSync(process.env.BASELINE_SUMMARY_PATH, "utf8")
              );
            } catch (_error) {
              summary = {};
            }
            const metrics = summary.metrics || {};
            const formatMetric = (value) => {
              const number = Number(value);
              return Number.isFinite(number) ? number.toFixed(3) : "n/a";
            };
            const resultStatus = String(
              summary.status || (exitCode === 0 ? "MEASURED" : "BLOCKED")
            ).toUpperCase();
            const state = exitCode === 0 ? "success" : "error";
            const next = summary.next_repair_target
              ? ` next=${summary.next_repair_target}`
              : "";
            const description = (
              `${resultStatus} cR=${formatMetric(metrics.candidate_recall)}` +
              ` cP=${formatMetric(metrics.candidate_precision)}` +
              ` rR=${formatMetric(metrics.promotion_recall)}` +
              ` rP=${formatMetric(metrics.promotion_precision)}` +
              ` stale=${formatMetric(metrics.stale_recall)}` +
              ` exec=${formatMetric(metrics.executable_projection_recall)}` +
              next
            ).slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "qualibug/implicit-rule-baseline",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Print baseline summaries
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chinese-explicit-fact-result/chinese_explicit_fact_baseline_summary.json" ]; then
            cat "$RUNNER_TEMP/chinese-explicit-fact-result/chinese_explicit_fact_baseline_summary.json"
          fi
          if [ -f "$RUNNER_TEMP/chinese-explicit-fact-result/evaluation/explicit_fact_bug_dependency_analysis.json" ]; then
            cat "$RUNNER_TEMP/chinese-explicit-fact-result/evaluation/explicit_fact_bug_dependency_analysis.json"
          fi
          if [ -f "$RUNNER_TEMP/implicit-rule-result/implicit_rule_baseline_summary.json" ]; then
            cat "$RUNNER_TEMP/implicit-rule-result/implicit_rule_baseline_summary.json"
          fi

      - name: Upload explicit fact baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-explicit-fact-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/chinese-explicit-fact-result
          if-no-files-found: error
          retention-days: 30

      - name: Upload implicit rule baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implicit-rule-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/implicit-rule-result
          if-no-files-found: error
          retention-days: 30

      - name: Enforce baseline results
        if: always()
        shell: bash
        env:
          EXPLICIT_BASELINE_EXIT_CODE: ${{ steps.explicit_fact_baseline.outputs.exit_code }}
          IMPLICIT_BASELINE_EXIT_CODE: ${{ steps.implicit_rule_baseline.outputs.exit_code }}
        run: |
          explicit_code="${EXPLICIT_BASELINE_EXIT_CODE:-2}"
          implicit_code="${IMPLICIT_BASELINE_EXIT_CODE:-2}"
          if ! [[ "$explicit_code" =~ ^[0-9]+$ ]]; then
            explicit_code=2
          fi
          if ! [[ "$implicit_code" =~ ^[0-9]+$ ]]; then
            implicit_code=2
          fi
          if [ "$explicit_code" -ne 0 ]; then
            exit "$explicit_code"
          fi
          exit "$implicit_code"
