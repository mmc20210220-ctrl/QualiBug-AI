name: Chinese explicit fact verified generalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chinese-explicit-fact-baseline.yml"

permissions:
  contents: write

concurrency:
  group: registered-chinese-explicit-fact-generalization
  cancel-in-progress: true

jobs:
  apply-test-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve permanent workflow and verify inputs
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=verify-inputs" >> "$GITHUB_ENV"
          set -euo pipefail
          git show "$GITHUB_SHA^:.github/workflows/chinese-explicit-fact-baseline.yml" > /tmp/original-chinese-baseline.yml
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py)" = "15a2157e71f0dd9c81eee16eb378f32db7e59475"
          test "$(git hash-object ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py)" = "fa9bbd906aa5b94abf9ffdd29979fb1d27d1a16c"
          PAYLOAD=.github/patches/chinese_explicit_fact_generalization_payload.tar.gz.b64
          echo "83af9c0f6f23dd06fde6f82d33f51fb62204e28dc4568a93d9dbd9513566ff0a  ${PAYLOAD}" | sha256sum -c -
          base64 -d "$PAYLOAD" > /tmp/chinese-generalization.tar.gz
          echo "8520879e0f2b2bf6ba6918725d6ded8f25b40ff675565aab7d0c8e0ebf1cd451  /tmp/chinese-generalization.tar.gz" | sha256sum -c -
          mkdir -p /tmp/chinese-generalization
          tar -xzf /tmp/chinese-generalization.tar.gz -C /tmp/chinese-generalization

      - name: Apply root-cause generalization
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=apply-root-cause-generalization" >> "$GITHUB_ENV"
          set -euo pipefail
          python /tmp/chinese-generalization/apply.py
          cp /tmp/chinese-generalization/test_chinese_explicit_fact_language_mutations.py \
            tests/test_chinese_explicit_fact_language_mutations.py
          git diff --check
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py
          tests/test_chinese_explicit_fact_language_mutations.py
          EOF
          git status --short | awk '{print $2}' | grep -v '^.github/' | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and compile
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=install-and-compile" >> "$GITHUB_ENV"
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q \
            ai_test_asset_center/enterprise_knowledge_center \
            benchmark_evaluator/enterprise_understanding

      - name: Run 31 language mutations
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=run-31-language-mutations" >> "$GITHUB_ENV"
          set -euo pipefail
          python -m pytest -q tests/test_chinese_explicit_fact_language_mutations.py

      - name: Run focused Chinese explicit fact suite
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=run-focused-suite" >> "$GITHUB_ENV"
          set -euo pipefail
          python -m pytest -q \
            tests/test_chinese_business_comprehension.py \
            tests/test_enterprise_understanding_structure_first_facts.py \
            tests/test_enterprise_understanding_chinese_explicit_fact_baseline.py \
            tests/test_enterprise_understanding_explicit_fact_bug_dependency.py \
            tests/test_enterprise_understanding_explicit_fact_commit_status.py \
            tests/test_enterprise_understanding_ground_truth_quarantine.py \
            tests/test_enterprise_understanding_fact_probe_policy.py \
            tests/test_enterprise_understanding_fact_slot_document.py \
            tests/test_enterprise_understanding_fact_slots.py \
            tests/test_enterprise_understanding_fact_slot_report.py \
            tests/test_enterprise_understanding_post_compile_governance.py \
            tests/test_enterprise_understanding_public_import_contract.py \
            tests/test_enterprise_understanding_typed_fact_authority.py \
            tests/test_enterprise_understanding_typed_relation_projection.py \
            tests/test_chinese_explicit_fact_language_mutations.py

      - name: Run clean isolated baseline
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=run-clean-isolated-baseline" >> "$GITHUB_ENV"
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/chinese-explicit-fact-workspace" "$RUNNER_TEMP/chinese-explicit-fact-result"
          python -m benchmark_evaluator.enterprise_understanding.chinese_explicit_fact_baseline \
            --workspace-root "$RUNNER_TEMP/chinese-explicit-fact-workspace" \
            --output "$RUNNER_TEMP/chinese-explicit-fact-result"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "chinese-explicit-fact-result" / "chinese_explicit_fact_baseline_summary.json"
          summary = json.loads(path.read_text(encoding="utf-8"))
          metrics = summary["metrics"]
          assert summary["status"] == "PASS", summary
          assert metrics["annotated_fact_count"] == 16, metrics
          assert metrics["exact_fact_count"] == 16, metrics
          assert metrics["measured_slot_count"] == 71, metrics
          assert metrics["exact_slot_count"] == 71, metrics
          assert metrics["fact_recall"] == 1.0, metrics
          assert metrics["slot_exact_accuracy"] == 1.0, metrics
          assert metrics["p0_exact_fact_recall"] == 1.0, metrics
          assert metrics["source_locator_exact_accuracy"] == 1.0, metrics
          assert metrics["accepted_fact_precision"] == 1.0, metrics
          assert metrics["false_accepted_fact_count"] == 0, metrics
          PY

      - name: Freeze verified commit and restore permanent workflow
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=freeze-verified-commit" >> "$GITHUB_ENV"
          set -euo pipefail
          cp /tmp/original-chinese-baseline.yml .github/workflows/chinese-explicit-fact-baseline.yml
          git checkout -- qualibug_ai.egg-info 2>/dev/null || true
          rm -f \
            .github/chinese-explicit-fact-generalization-trigger \
            .github/chinese-explicit-fact-generalization-failure.txt \
            .github/patches/chinese_explicit_fact_generalization_payload.tar.gz.b64 \
            .github/workflows/one-time-chinese-explicit-fact-generalization.yml \
            .github/workflows/one-time-export-current-main.yml \
            .github/source-export-trigger \
            .github/source-export-run-id \
            .github/workflows/one-time-chinese-fact-mutation-probe.yml \
            .github/chinese-fact-mutation-probe-trigger \
            .github/workflows/one-time-chinese-fact-mutation-probe-v2.yml \
            .github/chinese-fact-mutation-probe-v2-trigger \
            .github/chinese_fact_mutation_probe.py \
            .github/chinese-fact-mutation-run-id \
            .github/chinese-fact-mutation-report.json \
            .github/noop-tree-probe \
            .github/noop-tree-probe-2
          git config user.name "mmc20210220-ctrl"
          git config user.email "mmc20210220@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(understanding): generalize Chinese explicit fact semantics"

      - name: Rebase safely, reverify and push
        shell: bash
        run: |
          echo "CHINESE_FACT_STAGE=rebase-reverify-push" >> "$GITHUB_ENV"
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              python -m pytest -q tests/test_chinese_explicit_fact_language_mutations.py
              rm -rf "$RUNNER_TEMP/chinese-explicit-fact-reverify-workspace" "$RUNNER_TEMP/chinese-explicit-fact-reverify-result"
              python -m benchmark_evaluator.enterprise_understanding.chinese_explicit_fact_baseline \
                --workspace-root "$RUNNER_TEMP/chinese-explicit-fact-reverify-workspace" \
                --output "$RUNNER_TEMP/chinese-explicit-fact-reverify-result"
            fi
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Restore permanent workflow and publish failure stage
        if: failure()
        shell: bash
        run: |
          set -u
          git rebase --abort 2>/dev/null || true
          git fetch origin main || true
          git reset --hard origin/main || true
          if [ -f /tmp/original-chinese-baseline.yml ]; then
            cp /tmp/original-chinese-baseline.yml .github/workflows/chinese-explicit-fact-baseline.yml
          fi
          printf 'stage=%s\nevent_sha=%s\nrun_id=%s\n' \
            "${CHINESE_FACT_STAGE:-checkout-or-start}" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > .github/chinese-explicit-fact-generalization-failure.txt
          rm -f \
            .github/chinese-explicit-fact-generalization-trigger \
            .github/patches/chinese_explicit_fact_generalization_payload.tar.gz.b64 \
            .github/workflows/one-time-chinese-explicit-fact-generalization.yml \
            .github/workflows/one-time-export-current-main.yml \
            .github/source-export-trigger \
            .github/workflows/one-time-chinese-fact-mutation-probe.yml \
            .github/chinese-fact-mutation-probe-trigger \
            .github/workflows/one-time-chinese-fact-mutation-probe-v2.yml \
            .github/chinese-fact-mutation-probe-v2-trigger \
            .github/chinese_fact_mutation_probe.py \
            .github/noop-tree-probe \
            .github/noop-tree-probe-2
          git config user.name "mmc20210220-ctrl"
          git config user.email "mmc20210220@gmail.com"
          git add -A
          git commit -m "chore(understanding): report Chinese fact generalization failure" || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 0
          done
          exit 0
