name: One-time business lifecycle binding root fix

on:
  push:
    branches: [main]
    paths:
      - ".github/business-lifecycle-binding-root-fix-trigger"

permissions:
  contents: write

concurrency:
  group: one-time-business-lifecycle-binding-root-fix
  cancel-in-progress: false

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and decode lifecycle binding patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64=.github/patches/business_lifecycle_binding_root_fix.patch.gz.b64
          echo "f588561cd56d497e9701be77b532a053a860e27405078db324ed80e0e841b308  ${PATCH_B64}" | sha256sum -c -
          base64 -d "${PATCH_B64}" | gzip -d > /tmp/business-lifecycle-binding.patch
          echo "b54133f0e96cb9a50abd5157a5350960f6b8b40f592e851232b068df13c3a9fe  /tmp/business-lifecycle-binding.patch" | sha256sum -c -

      - name: Apply with three-way conflict detection
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --check /tmp/business-lifecycle-binding.patch
          git apply --3way /tmp/business-lifecycle-binding.patch
          git diff --check

      - name: Freeze exact source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/binding_identity_projection.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding_governance.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/observer_binding_identity_projection.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_materialization.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_plan.py
          tests/test_entity_lifecycle_behavior_binding.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          xargs -a /tmp/expected-files.txt git add --
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --cached --check

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile lifecycle binding authorities
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding_governance.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/binding_identity_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/observer_binding_identity_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_plan.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/runtime_materialization.py \
            tests/test_entity_lifecycle_behavior_binding.py

      - name: Run business behavior binding regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_entity_lifecycle_behavior_binding.py \
            tests/test_behavior_implementation_binding_object_identity.py \
            tests/test_behavior_implementation_binding_relationships.py \
            tests/test_runtime_plan_v1.py \
            tests/test_runtime_materialization_v1.py \
            tests/test_binding_identity_projection.py \
            tests/test_event_observer_implementation_mainline.py

      - name: Measure benchmark mall binding closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from ai_test_asset_center.enterprise_knowledge_center import (
              build_enterprise_business_knowledge_asset,
          )
          from ai_test_asset_center.enterprise_knowledge_center.enterprise_understanding import (
              build_governed_behavior_implementation_bindings,
          )

          asset = build_enterprise_business_knowledge_asset("benchmark_mall")
          model = asset.get("enterprise_understanding_model") or {}
          behaviors = [
              dict(row)
              for row in model.get("business_behaviors") or []
              if isinstance(row, dict) and row.get("status") == "CONFIRMED"
          ]
          bindings, unknowns, conflicts, gate = (
              build_governed_behavior_implementation_bindings(asset, behaviors)
          )
          metrics = gate.get("metrics") or {}
          ready = int(metrics.get("scenario_ready_binding_count") or 0)
          bound_outcomes = int(metrics.get("bound_mandatory_outcome_count") or 0)
          lifecycle_rows = [
              row
              for binding in bindings
              for row in binding.get("lifecycle_observer_bindings") or []
              if isinstance(row, dict) and row.get("status") == "BOUND"
          ]
          targets = {
              str(row.get("observer_interface_id") or "")
              for row in lifecycle_rows
          }
          strategies = {
              str(row.get("observation_strategy") or "")
              for row in lifecycle_rows
          }
          assert not conflicts, conflicts
          assert ready >= 3, metrics
          assert bound_outcomes >= 3, metrics
          assert len(lifecycle_rows) >= 3, lifecycle_rows
          assert "COLLECTION_DELTA_CREATED_ENTITY" in strategies, strategies
          assert "REQUEST_IDENTITY_ABSENT_FROM_COLLECTION" in strategies, strategies
          assert any("products" in value for value in targets), targets
          assert any("cart/items" in value for value in targets), targets
          assert any("users/addresses" in value for value in targets), targets
          print({
              "confirmed_behavior_count": len(behaviors),
              "scenario_ready_binding_count": ready,
              "bound_mandatory_outcome_count": bound_outcomes,
              "bound_lifecycle_observer_count": len(lifecycle_rows),
              "lifecycle_observer_targets": sorted(targets),
              "unknown_count": len(unknowns),
          })
          PY

      - name: Restore generated state and verify clean source scope
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- qualibug_ai.egg-info 2>/dev/null || true
          git checkout -- .
          git clean -fd
          git diff --exit-code
          git diff --cached --name-only | sort > /tmp/actual-files-after-tests.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files-after-tests.txt
          git diff --cached --check

      - name: Commit verified source and remove one-time delivery files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/business-lifecycle-binding-root-fix-trigger \
            .github/patches/business_lifecycle_binding_root_fix.patch.gz.b64 \
            .github/workflows/one-time-business-lifecycle-binding-root-fix.yml
          git config user.name "mmc20210220-ctrl"
          git config user.email "mmc20210220@gmail.com"
          git commit -m "fix(binding): close entity lifecycle outcome observers" -m "Bind source-declared entity creation and deletion outcomes to exact collection observers, carry one ObserverBinding identity through Scenario, Execution Contract, Runtime Plan and materialization, and keep HTTP status or collection count alone ineligible as lifecycle proof."
          git push origin HEAD:main
