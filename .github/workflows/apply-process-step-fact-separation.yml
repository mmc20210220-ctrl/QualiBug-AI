name: Diagnose process-step fact separation

on:
  push:
    branches: [main]
    paths:
      - tools/.one_shot/process_step_fact_separation/TRIGGER

permissions:
  contents: write

concurrency:
  group: process-step-fact-separation-main
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture migration and regression diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/process_step_diagnostic.log
          python -m py_compile tools/.one_shot/process_step_fact_separation/apply.py >> /tmp/process_step_diagnostic.log 2>&1
          echo "script_compile_status=$?" >> /tmp/process_step_diagnostic.log
          python tools/.one_shot/process_step_fact_separation/apply.py >> /tmp/process_step_diagnostic.log 2>&1
          migration_status=$?
          echo "migration_status=${migration_status}" >> /tmp/process_step_diagnostic.log
          if [ "${migration_status}" -eq 0 ]; then
            python -m py_compile \
              ai_test_asset_center/process_step_execution.py \
              ai_test_asset_center/process_step_semantic_projection.py \
              ai_test_asset_center/process_step_semantic_view.py \
              tests/test_process_step_fact_separation.py \
              >> /tmp/process_step_diagnostic.log 2>&1
            syntax_status=$?
            echo "syntax_status=${syntax_status}" >> /tmp/process_step_diagnostic.log
            if [ "${syntax_status}" -eq 0 ]; then
              python -m pip install -e . >> /tmp/process_step_diagnostic.log 2>&1
              install_status=$?
              echo "install_status=${install_status}" >> /tmp/process_step_diagnostic.log
              if [ "${install_status}" -eq 0 ]; then
                pytest -q \
                  tests/test_process_step_fact_separation.py \
                  tests/test_operational_lifecycle_authority.py \
                  tests/test_experiment_outcome_single_exit.py \
                  >> /tmp/process_step_diagnostic.log 2>&1
                echo "pytest_status=$?" >> /tmp/process_step_diagnostic.log
              fi
            fi
          fi
          git diff --stat >> /tmp/process_step_diagnostic.log 2>&1
          git reset --hard HEAD
          cp /tmp/process_step_diagnostic.log tools/.one_shot/process_step_fact_separation/diagnostic.log
          git config user.name 'qualibug-mainline-bot'
          git config user.email 'qualibug-mainline-bot@users.noreply.github.com'
          git add tools/.one_shot/process_step_fact_separation/diagnostic.log
          git commit -m 'diagnostic(process): capture process-step fact separation failure'
          git pull --rebase origin main
          git push origin HEAD:main
