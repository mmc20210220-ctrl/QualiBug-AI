name: Release Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q aitestops ai_test_asset_center benchmark_evaluator demo_system enterprise_bug_factory
      - name: Targeted regression tests
        run: |
          python -m pytest tests/test_phase92a_evidence_bridge.py tests/test_phase94abcd_bug_discovery_engine.py -q
          python -m pytest tests/test_discovery_engine_verifier_quality.py tests/test_grounded_probe_executor.py tests/test_blind_project_runner.py -q
      - name: Enterprise knowledge evidence regression
        run: |
          python -m pytest -q \
            tests/test_field_dictionary_evidence_truth.py \
            tests/test_enterprise_knowledge_center_parsing.py \
            tests/test_operator_authority_decision.py \
            tests/test_behavior_ir_single_fact_authority.py \
            tests/test_business_behavior_ir.py \
            tests/test_business_behavior_ir_logic_gate.py \
            tests/test_private_pilot_command_center_understanding.py
      - name: Build clean release archive
        run: python build_release.py --output build/QualiBug_V11_PRODUCTION_FINAL_CLEAN.zip

  frontend_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend quality gate
        working-directory: frontend
        env:
          AUTH_MODE: demo
        run: npm run ci:gate
