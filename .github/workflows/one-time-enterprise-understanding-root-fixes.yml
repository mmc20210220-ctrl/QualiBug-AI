name: One-time cross-source identity fusion root fixes

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-cross-source-identity-fusion-root-fixes
  cancel-in-progress: false

jobs:
  apply-test-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[internal] apply verified cross-source identity fusion root fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and decode source patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64=.github/patches/cross_source_identity_fusion.patch.gz.b64
          echo "773bda1826d0ef653f2ae3bbb201353e5a0d4d2d17760aa8b9c351ba05e631c8  ${PATCH_B64}" | sha256sum -c -
          base64 -d "${PATCH_B64}" | gzip -d > /tmp/cross_source_identity_fusion.patch
          echo "ed4d13783b1117e53dd63340666010e27bccedca10027fbeb48047d9a3aaed8f  /tmp/cross_source_identity_fusion.patch" | sha256sum -c -

      - name: Apply patch with three-way conflict detection
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --check /tmp/cross_source_identity_fusion.patch
          git apply --3way /tmp/cross_source_identity_fusion.patch
          git diff --check

      - name: Verify exact identity-fusion scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          .github/quality-gates-backend-tests.txt
          ai_test_asset_center/enterprise_knowledge_center/_common.py
          ai_test_asset_center/enterprise_knowledge_center/composition.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_edges.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_technical_projection.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_types.py
          ai_test_asset_center/enterprise_knowledge_center/implicit_rule_identity_reconciliation.py
          tests/test_enterprise_identity_governance.py
          tests/test_identity_benchmark_composition_order.py
          tests/test_implicit_rule_identity_reconciliation.py
          EOF
          git status --short | awk '{print $2}' | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile identity-fusion modules
        shell: bash
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/_common.py \
            ai_test_asset_center/enterprise_knowledge_center/composition.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_edges.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_technical_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_types.py \
            ai_test_asset_center/enterprise_knowledge_center/implicit_rule_identity_reconciliation.py

      - name: Run focused identity authority regressions
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_enterprise_identity_governance.py \
            tests/test_enterprise_identity_scope.py \
            tests/test_enterprise_identity_resolution.py \
            tests/test_implicit_rule_identity_reconciliation.py \
            tests/test_identity_benchmark_composition_order.py \
            tests/test_identity_field_evidence.py \
            tests/test_identity_structural_evidence.py \
            tests/test_technical_source_understanding_attachment.py

      - name: Commit root-cause changes and remove one-time executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QualiBug Automation"
          git config user.email "automation@qualibug.local"
          git add -A
          git rm .github/workflows/one-time-enterprise-understanding-root-fixes.yml
          git rm .github/root-fix-trigger
          git rm .github/patches/cross_source_identity_fusion.patch.gz.b64
          git commit -m 'fix(identity): close cross-source fusion authority gaps' \
            -m 'Use the previous finalized registry as the common baseline for both understanding passes, close source-declared alias anchors without enabling name-only merges, retire stale predicate-object coordinates, form authoritative rule-to-interface relations before identity freeze, and project only source-backed Rule→Fact→Entity technical bindings. Add focused regression and quality-gate coverage.'

      - name: Rebase and push main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
