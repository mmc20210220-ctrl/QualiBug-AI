name: Apply source-declared ownership fix

on:
  push:
    branches:
      - automation/source-ownership-fix
    paths:
      - .github/workflows/apply-source-ownership-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply root-cause fix
        env:
          PATCH_B64: 
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          import base64
          import os
          Path('/tmp/source-ownership-fix.patch').write_bytes(
              base64.b64decode(os.environ['PATCH_B64'])
          )
          PYFIX
          git apply --check /tmp/source-ownership-fix.patch
          git apply /tmp/source-ownership-fix.patch
          rm .github/workflows/apply-source-ownership-fix.yml

      - name: Run minimal regression
        run: |
          python -m py_compile ai_test_asset_center/obligation_compiler_base.py
          PYTHONPATH=. pytest -q \
            tests/test_source_declared_ownership_contract.py \
            tests/test_collection_ownership_isolation.py

      - name: Commit verified fix
        run: |
          git config user.name "QualiBug Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ai_test_asset_center/obligation_compiler_base.py \
            tests/test_source_declared_ownership_contract.py \
            .github/workflows/apply-source-ownership-fix.yml
          git commit -m "fix(discovery): compile source-declared ownership isolation"
          git push origin HEAD:automation/source-ownership-fix
