name: Enterprise Delivery Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verified-delivery-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate delivery package integrity rules
        run: |
          python -c "import ast; ast.parse(open('ai_test_asset_center/enterprise_delivery_package.py').read()); print('enterprise_delivery_package.py OK')"
          python -m pytest tests/test_phase111_delivery_package.py -q
