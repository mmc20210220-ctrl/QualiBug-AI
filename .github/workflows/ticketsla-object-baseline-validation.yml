name: TicketSLA Object Baseline Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ticketsla-object-baseline-validation.yml"
      - "benchmark_evaluator/enterprise_understanding/**"
      - "projects/ticketsla_d/**"
      - "ai_test_asset_center/enterprise_knowledge_center/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  ticketsla-object-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate baseline contracts
        run: |
          python -m pytest -q \
            tests/test_enterprise_understanding_ticketsla_object_baseline.py \
            tests/test_enterprise_understanding_ticketsla_source_snapshot.py \
            tests/test_enterprise_understanding_business_object_types.py \
            tests/test_enterprise_understanding_business_object_measurement_schema.py

      - name: Run real TicketSLA object baseline
        id: baseline
        shell: bash
        run: |
          set +e
          python -m benchmark_evaluator.enterprise_understanding.ticketsla_object_baseline \
            --root . \
            --output evaluator_outputs/ticketsla_d/business_object_baseline \
            2>&1 | tee evaluator_outputs/ticketsla_d/business_object_baseline/command.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve fail-visible result
        if: always()
        shell: bash
        run: |
          mkdir -p evaluator_outputs/ticketsla_d/business_object_baseline
          if [ ! -f evaluator_outputs/ticketsla_d/business_object_baseline/baseline_summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          target = Path("evaluator_outputs/ticketsla_d/business_object_baseline/baseline_summary.json")
          target.write_text(json.dumps({
              "schema": "qualibug.ticketsla-business-object-baseline.v1",
              "project_id": "ticketsla_d",
              "status": "BLOCKED",
              "reason_code": "BASELINE_SUMMARY_NOT_PRODUCED",
              "workflow_exit_code": "${{ steps.baseline.outputs.exit_code }}",
          }, ensure_ascii=False, indent=2, sort_keys=True), encoding="utf-8")
          PY
          fi
          cat evaluator_outputs/ticketsla_d/business_object_baseline/baseline_summary.json

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketsla-object-baseline
          path: evaluator_outputs/ticketsla_d/business_object_baseline
          if-no-files-found: error
          retention-days: 14
