name: API database contract alignment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_projection.py"
      - "ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_asset_projection.py"
      - "ai_test_asset_center/enterprise_knowledge_center/api_artifact_asset_projection.py"
      - "ai_test_asset_center/enterprise_knowledge_center/api_operation_schema_binding.py"
      - "ai_test_asset_center/enterprise_knowledge_center/api_database_contract_alignment.py"
      - "ai_test_asset_center/enterprise_knowledge_center/api_operation_database_projection.py"
      - "ai_test_asset_center/enterprise_knowledge_center/database_model_asset_projection.py"
      - "ai_test_asset_center/enterprise_knowledge_center/composition.py"
      - "tests/test_openapi_schema_fact_asset_projection.py"
      - "tests/test_api_database_contract_alignment.py"
      - "tests/test_api_operation_database_lineage.py"
      - ".github/workflows/api-database-contract-alignment.yml"

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile contract alignment stages
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/api_artifact_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/api_operation_schema_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/api_database_contract_alignment.py \
            ai_test_asset_center/enterprise_knowledge_center/api_operation_database_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_model_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/composition.py

      - name: Run contract alignment closure tests
        run: |
          pytest -q \
            tests/test_openapi_schema_fact_asset_projection.py \
            tests/test_api_database_contract_alignment.py \
            tests/test_api_operation_database_lineage.py
