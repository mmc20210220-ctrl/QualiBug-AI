permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile database understanding, observation and Oracle stages
        run: |
          python -m py_compile \
            ai_test_asset_center/database_observer_runtime.py \
            ai_test_asset_center/database_observer_experiment_projection.py \
            ai_test_asset_center/database_observer_experiment_runtime.py \
            ai_test_asset_center/database_state_transition_oracle.py \
            ai_test_asset_center/database_state_transition_experiment_projection.py \
            ai_test_asset_center/database_state_transition_finding_bridge.py \
            ai_test_asset_center/database_numeric_oracle.py \
            ai_test_asset_center/database_numeric_experiment_projection.py \
            ai_test_asset_center/database_numeric_finding_bridge.py \
            ai_test_asset_center/database_relation_observer_runtime.py \
            ai_test_asset_center/database_relation_observer_experiment_runtime.py \
            ai_test_asset_center/database_relation_experiment_bridge.py \
            ai_test_asset_center/database_relation_numeric_experiment_projection.py \
            ai_test_asset_center/database_relation_numeric_oracle.py \
            ai_test_asset_center/database_relation_numeric_finding_bridge.py \
            ai_test_asset_center/database_relation_delta_experiment_projection.py \
            ai_test_asset_center/database_relation_delta_projection_gate.py \
            ai_test_asset_center/database_relation_delta_oracle.py \
            ai_test_asset_center/database_relation_delta_lineage.py \
            ai_test_asset_center/database_relation_delta_finding_bridge.py \
            ai_test_asset_center/experiment_compiler.py \
            ai_test_asset_center/experiment_executor.py \
            ai_test_asset_center/non_http_observers.py \
            ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/openapi_schema_fact_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/api_artifact_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/api_operation_schema_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/api_database_contract_alignment.py \
            ai_test_asset_center/enterprise_knowledge_center/api_operation_database_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_mapping_authority.py \
            ai_test_asset_center/enterprise_knowledge_center/database_model_asset_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_observer_contract_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_observer_implementation_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/database_observer_runtime_plan_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_observer_runtime_materialization_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_relation_observer_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/database_relation_authority.py \
            ai_test_asset_center/enterprise_knowledge_center/database_relation_observer_contract_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding_governance.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/scenario_execution_contract_projection.py \
            ai_test_asset_center/enterprise_knowledge_center/composition.py \
