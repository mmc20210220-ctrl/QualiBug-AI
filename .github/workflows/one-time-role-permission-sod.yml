name: Role permission SoD delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: role-permission-sod-root-delivery
  cancel-in-progress: false

jobs:
  deliver-role-permission-sod:
    if: github.head_ref == 'automation/role-permission-sod-20260801-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Clone latest main without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'

      - name: Verify and apply immutable SoD source change
        working-directory: repo
        run: |
          set -euo pipefail
          payload=.github/delivery/role-permission-sod.patch.gz.b64
          echo '4a6d2d3dd52e157513e1a6d6be5dd69c182d29687d76f97b4a1427f88c599933  '"${payload}" | sha256sum -c -
          base64 -d "${payload}" | gzip -d > /tmp/role-permission-sod.patch
          echo 'cb95e782323c32680d7ce50814ae3f50fe1d95458184d4b2ee97ed4b909628b7  /tmp/role-permission-sod.patch' | sha256sum -c -
          git apply --3way --check /tmp/role-permission-sod.patch
          git apply --3way /tmp/role-permission-sod.patch
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          ai_test_asset_center/behavior_ir.py
          ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension/__init__.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/fact_permission_matrix.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/fact_permission_matrix_core.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/segregation_of_duties_authority.py
          ai_test_asset_center/experiment_compiler_obligation_core.py
          ai_test_asset_center/obligation_compiler.py
          ai_test_asset_center/obligation_compiler_sod.py
          ai_test_asset_center/runtime_binding_graph.py
          tests/test_enterprise_understanding_segregation_of_duties.py
          tests/test_enterprise_understanding_sod_executor_e2e.py
          EOF
          git diff --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install product and test dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'

      - name: Compile and run role-permission regressions
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ai_test_asset_center/behavior_ir.py \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension/__init__.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/fact_permission_matrix.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/fact_permission_matrix_core.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/segregation_of_duties_authority.py \
            ai_test_asset_center/experiment_compiler_obligation_core.py \
            ai_test_asset_center/obligation_compiler.py \
            ai_test_asset_center/obligation_compiler_sod.py \
            ai_test_asset_center/runtime_binding_graph.py
          python3 -m pytest -q \
            tests/test_enterprise_understanding_segregation_of_duties.py \
            tests/test_enterprise_understanding_sod_executor_e2e.py \
            tests/test_enterprise_understanding_authorization_coordinate_edge.py \
            tests/test_enterprise_understanding_authorization_unknown_propagation.py \
            tests/test_enterprise_understanding_credential_identity_coordinates.py \
            tests/test_enterprise_understanding_experiment_actor_credential_identity.py \
            tests/test_enterprise_understanding_responsibility_authorization_boundary.py
          python3 -m pytest -q \
            tests/test_behavior_ir_obligation_experiment.py \
            tests/test_business_behavior_ir.py \
            tests/test_behavior_ir_source_relationships.py \
            -k 'permission or authorization'
          git diff --check

      - name: Commit source and remove delivery assets
        working-directory: repo
        run: |
          set -euo pipefail
          git rm \
            .github/delivery/role-permission-sod.patch.gz.b64 \
            .github/workflows/one-time-role-permission-sod.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(auth): enforce source-governed separation of duties' \
            -m 'Bind explicit maker-checker contracts to exact semantic operations, preserve multi-role account assignments under one credential identity, and compile shared-credential conflicts through the existing authorization control/treatment, fixture, causality and delivery gates.'

      - name: Rebase, reverify, and push main
        working-directory: repo
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]]; then
            git rebase origin/main
            python3 -m py_compile \
              ai_test_asset_center/behavior_ir.py \
              ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/segregation_of_duties_authority.py \
              ai_test_asset_center/experiment_compiler_obligation_core.py \
              ai_test_asset_center/obligation_compiler_sod.py \
              ai_test_asset_center/runtime_binding_graph.py
            python3 -m pytest -q \
              tests/test_enterprise_understanding_segregation_of_duties.py \
              tests/test_enterprise_understanding_sod_executor_e2e.py
            python3 -m pytest -q \
              tests/test_behavior_ir_obligation_experiment.py \
              tests/test_business_behavior_ir.py \
              tests/test_behavior_ir_source_relationships.py \
              -k 'permission or authorization'
            git diff --check
          fi
          git push origin HEAD:main
