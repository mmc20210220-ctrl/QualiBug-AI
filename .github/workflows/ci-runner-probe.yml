name: Runner Probe

on:
  push:
    branches: ["eval/real-runtime-20260805"]
    paths:
      - ".github/workflows/ci-runner-probe.yml"

permissions:
  contents: read

jobs:
  probe-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enter Ubuntu runner
        run: |
          uname -a
          echo RUNNER_OK=ubuntu

  probe-macos:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Enter macOS runner
        run: |
          uname -a
          echo RUNNER_OK=macos
          command -v brew || true
          command -v postgres || true
