name: Apply single-object complex lifecycle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-single-object-complex-lifecycle
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-shot/single-object-complex-lifecycle
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply, compile, test, and seal
        env:
          PYTHONPATH: .
        run: bash .github/delivery/single-object-complex/apply-and-verify.sh
