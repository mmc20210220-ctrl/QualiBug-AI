name: Verify source ownership root fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply root-cause change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_test_asset_center/obligation_compiler_base.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''def _corpus_ownership_params(operations: list[dict[str, Any]]) -> list[str]:
'''
          helper = '''def _source_declares_owned_collection_read(operation: dict[str, Any]) -> bool:
    """Return whether one read operation explicitly declares caller ownership.

    This is operation-local source authority: an own-scope statement and an
    ownership identity parameter must both be present on the documented read.
    A separate permission-matrix ``owns`` edge is useful corroboration, but is
    not required to restate the same contract.
    """

    is_read = _text(
        operation.get("read_write") or operation.get("side_effect_class")
    ) != "write"
    return bool(
        is_read
        and not _path_has_resource_placeholder(
            _text(operation.get("path") or operation.get("raw_path"))
        )
        and _operation_declares_ownership_language(operation)
        and _ownership_params_declared_on_operation(operation)
    )


'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    owned_isolation_ops = [
        op for op in [*read_ops, *write_ops]
        if _relations_for_operation(relations, _text(op.get("id")), {"owns"})
    ]
'''
          new = '''    owned_isolation_ops = [
        op
        for op in [*read_ops, *write_ops]
        if _relations_for_operation(relations, _text(op.get("id")), {"owns"})
        or _source_declares_owned_collection_read(op)
    ]
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('owned isolation anchor missing')
              text = text.replace(old, new, 1)

          old = '''        for relation in ownership_relations:
            actor_ref = _relation_actor_ref(relation)
            actor = active_actors_by_id.get(actor_ref)
            if actor and _text(actor.get("account_ref")):
                relation_by_actor.setdefault(actor_ref, []).append(relation)
        by_role: dict[str, list[str]] = {}
'''
          new = '''        for relation in ownership_relations:
            actor_ref = _relation_actor_ref(relation)
            actor = active_actors_by_id.get(actor_ref)
            if actor and _text(actor.get("account_ref")):
                relation_by_actor.setdefault(actor_ref, []).append(relation)
        if not relation_by_actor and _source_declares_owned_collection_read(op):
            # The operation's own contract already states that each caller may
            # access only their own collection. Use declared runtime accounts
            # as principals and keep the existing same-role pairing below.
            relation_by_actor = {
                actor_ref: []
                for actor_ref, actor in active_actors_by_id.items()
                if _text(actor.get("account_ref"))
            }
        by_role: dict[str, list[str]] = {}
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('actor relation anchor missing')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add unfamiliar-system regression
        run: |
          cat > tests/test_source_declared_ownership_contract.py <<'PY'
          from ai_test_asset_center.behavior_ir import empty_behavior_ir
          from ai_test_asset_center.experiment_compiler_obligation import compile_experiment_for_obligation
          from ai_test_asset_center.obligation_compiler import compile_obligations_from_behavior_ir


          def _ir(summary: str) -> dict:
              ir = empty_behavior_ir(project_id="unfamiliar-owned-documents")
              ir.update({
                  "operations": [
                      {
                          "id": "op-documents",
                          "method": "GET",
                          "path": "/api/documents",
                          "read_write": "read",
                          "summary": summary,
                          "tags": ["api", "accountId"],
                          "source_refs": [{
                              "source_id": "api_spec",
                              "locator": "GET /api/documents",
                              "kind": "api_operation",
                          }],
                      },
                      {
                          "id": "op-current-principal",
                          "method": "GET",
                          "path": "/api/session/me",
                          "read_write": "read",
                          "tags": ["api"],
                          "source_refs": [{
                              "source_id": "api_spec",
                              "locator": "GET /api/session/me",
                              "kind": "api_operation",
                          }],
                      },
                  ],
                  "actors": [
                      {
                          "id": "actor-member-a",
                          "role": "member",
                          "account_ref": "member_a",
                          "account_status": "active",
                          "credential_secret_ref": "secret_ref:test_accounts:member_a",
                      },
                      {
                          "id": "actor-member-b",
                          "role": "member",
                          "account_ref": "member_b",
                          "account_status": "active",
                          "credential_secret_ref": "secret_ref:test_accounts:member_b",
                      },
                  ],
                  "relations": [],
              })
              return ir


          def test_source_owned_collection_enters_existing_isolation_mainline() -> None:
              ir = _ir(
                  "Callers can only query their own documents; cross-account access "
                  "through accountId must be rejected"
              )
              obligations = [
                  row
                  for row in compile_obligations_from_behavior_ir(ir)["obligations"]
                  if row["risk_family"] == "isolation"
                  and row["property"]["operation_ref"] == "op-documents"
              ]
              assert len(obligations) == 2
              assert {
                  (row["property"]["owner_actor_ref"], row["property"]["viewer_actor_ref"])
                  for row in obligations
              } == {
                  ("actor-member-a", "actor-member-b"),
                  ("actor-member-b", "actor-member-a"),
              }
              assert all(row["relation_refs"] == [] for row in obligations)
              assert obligations[0]["property"]["ownership_param"] == "accountId"
              assert obligations[0]["property"]["ownership_param_location"] == "query"

              experiment = compile_experiment_for_obligation(
                  obligations[0], behavior_ir=ir, environment_type="test"
              )
              assert experiment["compile_receipt"]["status"] == "COMPILED"
              assert experiment["treatment_plan"][0]["query"] == {"accountId": "{user_id}"}
              assert "user_id" in {
                  row.get("target") for row in experiment.get("binding_plan") or []
              }


          def test_identity_filter_without_owner_contract_does_not_create_isolation() -> None:
              ir = _ir("Filter documents by accountId")
              assert not [
                  row
                  for row in compile_obligations_from_behavior_ir(ir)["obligations"]
                  if row["risk_family"] == "isolation"
                  and row["property"]["operation_ref"] == "op-documents"
              ]
          PY

      - name: Run minimal regression
        run: |
          python -m py_compile ai_test_asset_center/obligation_compiler_base.py
          PYTHONPATH=. pytest -q \
            tests/test_source_declared_ownership_contract.py \
            tests/test_collection_ownership_isolation.py

      - name: Commit verified code only
        run: |
          rm -f .github/workflows/apply-source-ownership-fix.yml
          rm -f .github/workflows/verify-source-ownership-fix.yml
          git config user.name "QualiBug Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ai_test_asset_center/obligation_compiler_base.py \
            tests/test_source_declared_ownership_contract.py \
            .github/workflows
          git commit -m "fix(discovery): compile source-declared ownership isolation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
