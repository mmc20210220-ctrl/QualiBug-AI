name: Apply recall coverage authority root fix to main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: recall-service-aware-operation-dedupe
  cancel-in-progress: false

jobs:
  apply-service-aware-dedupe:
    if: github.event.issue.title == 'RUN_RECALL_SERVICE_AWARE_OPERATION_DEDUPE_20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recall-service-aware-operation-dedupe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact patch and verify
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '== apply =='
            python -m py_compile tools/.one_shot/recall_coverage_authority/apply.py && \
            python tools/.one_shot/recall_coverage_authority/apply.py && \
            python -m py_compile ai_test_asset_center/behavior_ir_core.py tests/test_recall_coverage_authority.py && \
            git diff --check && \
            echo '== install ==' && \
            python -m pip install --upgrade pip -q && \
            python -m pip install -e . -q && \
            echo '== focused regressions ==' && \
            python -m pytest -q tests/test_recall_coverage_authority.py && \
            echo '== package compile ==' && \
            python -m compileall -q ai_test_asset_center
          } 2>&1 | tee /tmp/recall-service-aware-dedupe.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 160 /tmp/recall-service-aware-dedupe.log > /tmp/recall-tail.txt
            {
              echo 'Service-aware operation dedupe Recall fix FAILED verification.'
              echo
              echo '```text'
              cat /tmp/recall-tail.txt
              echo '```'
            } > /tmp/issue-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true
            exit "$status"
          fi

          git fetch origin main
          git checkout -B main origin/main
          python tools/.one_shot/recall_coverage_authority/apply.py
          python -m py_compile ai_test_asset_center/behavior_ir_core.py tests/test_recall_coverage_authority.py
          python -m pytest -q tests/test_recall_coverage_authority.py
          python -m compileall -q ai_test_asset_center
          git rm .github/workflows/apply-recall-coverage-authority-main.yml
          git config user.name 'qualibug-recall-bot'
          git config user.email 'qualibug-recall-bot@users.noreply.github.com'
          git add ai_test_asset_center/behavior_ir_core.py tests/test_recall_coverage_authority.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(recall): preserve service-aware operation identity'
          git push origin HEAD:main
          commit_sha=$(git rev-parse HEAD)
          {
            echo "Service-aware operation identity Recall fix PASSED and was pushed to main: \`$commit_sha\`."
            echo
            echo 'Verification executed: exact patch, py_compile, focused regressions, and compileall.'
            echo
            echo '```text'
            tail -n 100 /tmp/recall-service-aware-dedupe.log
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true
