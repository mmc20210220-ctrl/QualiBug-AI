name: Apply recall coverage authority root fix to main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: recall-coverage-authority-main
  cancel-in-progress: false

jobs:
  root-fix:
    if: github.event.issue.title == 'RUN_RECALL_COVERAGE_AUTHORITY_ROOT_FIX_20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recall-coverage-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply and verify root fix
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '== apply =='
            python -m py_compile tools/.one_shot/recall_coverage_authority/apply.py && \
            python tools/.one_shot/recall_coverage_authority/apply.py && \
            python -m py_compile \
              ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
              ai_test_asset_center/discovery_runtime_planning.py \
              ai_test_asset_center/coverage_unit_registry.py \
              tests/test_recall_coverage_authority.py && \
            git diff --check && \
            echo '== install ==' && \
            python -m pip install --upgrade pip -q && \
            python -m pip install -e . -q && \
            echo '== focused regressions ==' && \
            python -m pytest -q tests/test_recall_coverage_authority.py && \
            echo '== existing related regressions ==' && \
            bash -c 'mapfile -t RELATED < <(grep -rlE "compute_obligation_coverage_gaps|build_behavior_ir_coverage_map|coverage_unit_registry|derive_canonical_obligation_key" tests --include="test_*.py" | grep -v "test_recall_coverage_authority.py" | head -40 || true); if [ "${#RELATED[@]}" -gt 0 ]; then printf "Related regression files:\\n%s\\n" "${RELATED[*]}"; python -m pytest -q "${RELATED[@]}"; fi' && \
            echo '== package compile ==' && \
            python -m compileall -q ai_test_asset_center
          } 2>&1 | tee /tmp/recall-coverage-authority.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/recall-coverage-authority.log > /tmp/recall-tail.txt
            {
              echo 'Recall coverage authority root fix FAILED verification.'
              echo
              echo '```text'
              cat /tmp/recall-tail.txt
              echo '```'
            } > /tmp/issue-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true
            exit "$status"
          fi

          mkdir -p /tmp/recall-fix/ai_test_asset_center /tmp/recall-fix/tests
          cp ai_test_asset_center/behavior_ir_hypothesis_coverage.py /tmp/recall-fix/ai_test_asset_center/
          cp ai_test_asset_center/discovery_runtime_planning.py /tmp/recall-fix/ai_test_asset_center/
          cp ai_test_asset_center/coverage_unit_registry.py /tmp/recall-fix/ai_test_asset_center/
          cp tests/test_recall_coverage_authority.py /tmp/recall-fix/tests/

          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/recall-fix/ai_test_asset_center/behavior_ir_hypothesis_coverage.py ai_test_asset_center/
          cp /tmp/recall-fix/ai_test_asset_center/discovery_runtime_planning.py ai_test_asset_center/
          cp /tmp/recall-fix/ai_test_asset_center/coverage_unit_registry.py ai_test_asset_center/
          cp /tmp/recall-fix/tests/test_recall_coverage_authority.py tests/
          git rm .github/workflows/apply-recall-coverage-authority-main.yml
          git config user.name 'qualibug-recall-bot'
          git config user.email 'qualibug-recall-bot@users.noreply.github.com'
          git add \
            ai_test_asset_center/behavior_ir_hypothesis_coverage.py \
            ai_test_asset_center/discovery_runtime_planning.py \
            ai_test_asset_center/coverage_unit_registry.py \
            tests/test_recall_coverage_authority.py
          git diff --cached --check
          git commit -m 'fix(discovery): make behavior coverage identity exact'
          git push origin HEAD:main
          commit_sha=$(git rev-parse HEAD)
          {
            echo "Recall coverage authority root fix PASSED and was pushed to main: \`$commit_sha\`."
            echo
            echo 'Verification executed: py_compile, git diff --check, focused recall regressions, existing related regression files, and compileall.'
            echo
            echo '```text'
            tail -n 80 /tmp/recall-coverage-authority.log
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md || true
