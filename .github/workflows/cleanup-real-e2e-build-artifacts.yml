name: Cleanup real E2E build artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cleanup-real-e2e-build-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-shot/real-e2e-lifecycle-authority
          fetch-depth: 0
          persist-credentials: true
      - name: Restore tracked packaging metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            qualibug_ai.egg-info/PKG-INFO \
            qualibug_ai.egg-info/SOURCES.txt \
            qualibug_ai.egg-info/entry_points.txt \
            qualibug_ai.egg-info/requires.txt
          git rm .github/workflows/cleanup-real-e2e-build-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(runtime): remove build metadata drift'
          git push origin HEAD:one-shot/real-e2e-lifecycle-authority
