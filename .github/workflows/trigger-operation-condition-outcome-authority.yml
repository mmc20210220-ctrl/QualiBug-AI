name: Verify canonical behavior authority

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: verify-canonical-behavior-authority-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.issue.title == 'Canonical behavior authority regression'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused regression and persist receipt only
        shell: bash
        run: |
          set +e
          python -m pip install -e . > /tmp/regression.log 2>&1
          install_status=$?
          echo "install_status=${install_status}" >> /tmp/regression.log
          pytest_status=99
          if [ "${install_status}" -eq 0 ]; then
            pytest -q \
              tests/test_operation_condition_outcome_authority.py \
              tests/test_business_behavior_ir.py \
              tests/test_business_behavior_ir_logic_gate.py \
              tests/test_behavior_implementation_binding.py \
              tests/test_behavior_implementation_binding_governance.py \
              >> /tmp/regression.log 2>&1
            pytest_status=$?
          fi
          echo "pytest_status=${pytest_status}" >> /tmp/regression.log
          git reset --hard HEAD
          git clean -fd
          cp /tmp/regression.log tools/.one_shot/operation_condition_outcome/regression.log
          git config user.name "qualibug-mainline-bot"
          git config user.email "qualibug-mainline-bot@users.noreply.github.com"
          git add tools/.one_shot/operation_condition_outcome/regression.log
          git commit -m "test(understanding): record canonical behavior authority regression"
          git pull --rebase origin main
          git push origin HEAD:main
