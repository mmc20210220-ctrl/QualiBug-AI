name: Diagnose operation condition outcome authority

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: diagnose-operation-condition-outcome-authority-main
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.issue.title == 'DIAGNOSE_OPERATION_CONDITION_OUTCOME_AUTHORITY_20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture migration and regression diagnostics
        shell: bash
        run: |
          set +e
          mapfile -t parts < <(find tools/.one_shot/operation_condition_outcome -maxdepth 1 -type f -name 'part-*' | sort)
          {
            echo "part_count=${#parts[@]}"
            printf '%s\n' "${parts[@]}"
          } > /tmp/diagnostic.log
          if [ "${#parts[@]}" -eq 6 ]; then
            cat "${parts[@]}" > /tmp/apply_operation_condition_outcome.py
            python -m py_compile /tmp/apply_operation_condition_outcome.py >> /tmp/diagnostic.log 2>&1
            compile_status=$?
            echo "compile_status=${compile_status}" >> /tmp/diagnostic.log
            if [ "${compile_status}" -eq 0 ]; then
              python /tmp/apply_operation_condition_outcome.py >> /tmp/diagnostic.log 2>&1
              migration_status=$?
              echo "migration_status=${migration_status}" >> /tmp/diagnostic.log
              if [ "${migration_status}" -eq 0 ]; then
                python -m pip install -e . >> /tmp/diagnostic.log 2>&1
                install_status=$?
                echo "install_status=${install_status}" >> /tmp/diagnostic.log
                if [ "${install_status}" -eq 0 ]; then
                  pytest -q \
                    tests/test_operation_condition_outcome_authority.py \
                    tests/test_business_behavior_ir.py \
                    tests/test_business_behavior_ir_logic_gate.py \
                    tests/test_behavior_implementation_binding.py \
                    tests/test_behavior_implementation_binding_governance.py \
                    >> /tmp/diagnostic.log 2>&1
                  echo "pytest_status=$?" >> /tmp/diagnostic.log
                fi
              fi
            fi
          else
            echo "unexpected_part_count" >> /tmp/diagnostic.log
          fi
          git diff --stat >> /tmp/diagnostic.log 2>&1
          git reset --hard HEAD
          cp /tmp/diagnostic.log tools/.one_shot/operation_condition_outcome/diagnostic.log
          git config user.name "qualibug-mainline-bot"
          git config user.email "qualibug-mainline-bot@users.noreply.github.com"
          git add tools/.one_shot/operation_condition_outcome/diagnostic.log
          git commit -m "diagnostic(understanding): capture canonical behavior authority failure"
          git pull --rebase origin main
          git push origin HEAD:main
