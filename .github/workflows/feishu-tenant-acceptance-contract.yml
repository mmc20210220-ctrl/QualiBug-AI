name: Feishu tenant acceptance contract

on:
  push:
    branches: [main]
    paths:
      - "ai_test_asset_center/feishu_tenant_acceptance.py"
      - "ai_test_asset_center/feishu_tenant_acceptance_reports.py"
      - "ai_test_asset_center/private_pilot_connector_handlers.py"
      - "ai_test_asset_center/connector_auto_sync.py"
      - "ai_test_asset_center/feishu_connector_capability_sync.py"
      - "ai_test_asset_center/connector_sync_authority.py"
      - "tests/test_feishu_tenant_acceptance.py"
      - "tests/test_feishu_tenant_acceptance_reports.py"
      - "tests/test_private_pilot_connector_acceptance_handlers.py"
      - "pyproject.toml"
      - ".github/workflows/feishu-tenant-acceptance-contract.yml"
  pull_request:
    paths:
      - "ai_test_asset_center/feishu_tenant_acceptance.py"
      - "ai_test_asset_center/feishu_tenant_acceptance_reports.py"
      - "ai_test_asset_center/private_pilot_connector_handlers.py"
      - "ai_test_asset_center/connector_auto_sync.py"
      - "ai_test_asset_center/feishu_connector_capability_sync.py"
      - "ai_test_asset_center/connector_sync_authority.py"
      - "tests/test_feishu_tenant_acceptance.py"
      - "tests/test_feishu_tenant_acceptance_reports.py"
      - "tests/test_private_pilot_connector_acceptance_handlers.py"
      - "pyproject.toml"
      - ".github/workflows/feishu-tenant-acceptance-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile acceptance authorities
        run: |
          python -m py_compile ai_test_asset_center/feishu_tenant_acceptance.py
          python -m py_compile ai_test_asset_center/feishu_tenant_acceptance_reports.py
          python -m py_compile ai_test_asset_center/private_pilot_connector_handlers.py

      - name: Verify CLI registration
        run: |
          python - <<'PY'
          import importlib.metadata
          scripts = {
              entry.name: entry.value
              for entry in importlib.metadata.entry_points(group="console_scripts")
          }
          expected = "ai_test_asset_center.feishu_tenant_acceptance:main"
          actual = scripts.get("qualibug-feishu-tenant-acceptance")
          if actual != expected:
              raise SystemExit(f"CLI registration mismatch: {actual!r} != {expected!r}")
          PY

      - name: Run focused acceptance regressions
        run: |
          python -m pytest -q \
            tests/test_feishu_tenant_acceptance.py \
            tests/test_feishu_tenant_acceptance_reports.py \
            tests/test_private_pilot_connector_acceptance_handlers.py
