name: Temporary schema regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: AST, import and shape checks
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from ai_test_asset_center.enterprise_knowledge_center.enterprise_understanding.schema import (
              empty_model,
              evidence_from_fact,
              validate_model_shape,
          )
          path = Path('ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/schema.py')
          ast.parse(path.read_text(encoding='utf-8'))
          model = empty_model()
          required = {
              'scenario_ir_evidence_index',
              'scenario_ir_relationships',
              'scenario_execution_contract_evidence_index',
              'scenario_execution_contract_relationships',
              'runtime_plan_evidence_index',
              'runtime_plan_relationships',
              'runtime_materializations',
              'runtime_materialization_evidence_index',
              'runtime_materialization_relationships',
              'conflicts',
              'evidence_index',
              'metrics',
          }
          assert required <= model.keys()
          assert validate_model_shape(model) == []
          assert evidence_from_fact({
              'fact_id': 'missing-evidence',
              'status': 'ACCEPTED',
              'raw_statement': 'generated statement is not exact evidence',
              'source_spans': [],
          }) == []
          print('AST_IMPORT_SHAPE_OK')
          PY
      - name: Required six-file regression
        run: |
          python -m pytest -q \
            tests/test_behavior_ir_single_fact_authority.py \
            tests/test_business_behavior_ir.py \
            tests/test_business_behavior_ir_logic_gate.py \
            tests/test_private_pilot_command_center_understanding.py \
            tests/test_enterprise_knowledge_center_parsing.py \
            tests/test_operator_authority_decision.py
