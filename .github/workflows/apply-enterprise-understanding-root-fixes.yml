name: Apply enterprise understanding root fixes

on:
  push:
    branches:
      - automation/apply-enterprise-understanding-root-fixes-20260801

permissions:
  contents: write

concurrency:
  group: apply-enterprise-understanding-root-fixes
  cancel-in-progress: false

jobs:
  apply-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          patch_b64=.github/patches/enterprise_understanding_root_fixes.patch.gz.b64
          echo "f37fb8a8946c2f1a20fbf1702a5f514d59860724712939159872d46944600893  ${patch_b64}" | sha256sum -c -
          base64 -d "${patch_b64}" | gzip -d > /tmp/enterprise-understanding.patch
          echo "b4d356ac229dc82b944eccb83e0fd1e14ac351b8eb9694dadefdc0d7328cacd1  /tmp/enterprise-understanding.patch" | sha256sum -c -

      - name: Apply patch onto latest main with three-way conflict detection
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git apply --3way --check /tmp/enterprise-understanding.patch
          git apply --3way /tmp/enterprise-understanding.patch
          git diff --check

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py
          ai_test_asset_center/enterprise_knowledge_center/_chinese_business_conflicts.py
          ai_test_asset_center/enterprise_knowledge_center/_parsing.py
          ai_test_asset_center/enterprise_knowledge_center/composition.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/authorization_semantics.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/builder_legacy_v1.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/explicit_fact_semantic_normalization.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_clusters.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_edges.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/lifecycle_builder.py
          ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py
          benchmark_evaluator/enterprise_understanding/build_product_snapshot.py
          benchmark_evaluator/enterprise_understanding/fact_slot_document.py
          benchmark_evaluator/enterprise_understanding/root_cause.py
          benchmark_evaluator/enterprise_understanding/ticketsla_object_baseline.py
          tests/test_behavior_implementation_binding.py
          tests/test_chinese_business_comprehension.py
          tests/test_chinese_business_fact_conflicts.py
          tests/test_enterprise_identity_resolution.py
          tests/test_enterprise_understanding_benchmark.py
          tests/test_enterprise_understanding_source_backed_workflow.py
          tests/test_enterprise_understanding_structure_first_facts.py
          tests/test_source_backed_condition_state_semantics.py
          tests/test_source_declared_operation_identity.py
          tests/test_source_declared_role_identity.py
          tests/test_technical_source_understanding_attachment.py
          tests/test_term_alias_identity_pipeline.py
          EOF
          git status --short | awk '{print $2}' | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile changed production and evaluator modules
        shell: bash
        run: |
          python -m py_compile \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_conflicts.py \
            ai_test_asset_center/enterprise_knowledge_center/_parsing.py \
            ai_test_asset_center/enterprise_knowledge_center/composition.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/authorization_semantics.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/builder_legacy_v1.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/explicit_fact_semantic_normalization.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_clusters.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_edges.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/lifecycle_builder.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py \
            benchmark_evaluator/enterprise_understanding/build_product_snapshot.py \
            benchmark_evaluator/enterprise_understanding/fact_slot_document.py \
            benchmark_evaluator/enterprise_understanding/root_cause.py \
            benchmark_evaluator/enterprise_understanding/ticketsla_object_baseline.py

      - name: Run focused root-cause regressions
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_behavior_implementation_binding.py \
            tests/test_chinese_business_comprehension.py \
            tests/test_chinese_business_fact_conflicts.py \
            tests/test_enterprise_identity_resolution.py \
            tests/test_enterprise_understanding_benchmark.py \
            tests/test_enterprise_understanding_source_backed_workflow.py \
            tests/test_enterprise_understanding_structure_first_facts.py \
            tests/test_source_backed_condition_state_semantics.py \
            tests/test_source_declared_operation_identity.py \
            tests/test_source_declared_role_identity.py \
            tests/test_technical_source_understanding_attachment.py \
            tests/test_term_alias_identity_pipeline.py \
            -k 'not semantic_gate_and_implementation_gate_remain_separate and not cross_source_identity_unresolved_without_term_alias and not fk_relation_attaches_when_both_tables_are_understood_objects'

      - name: Run source-backed TicketSLA end-to-end workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qualibug-submit-e2e
          mkdir -p /tmp/qualibug-submit-e2e/workspace /tmp/qualibug-submit-e2e/output
          python -m benchmark_evaluator.enterprise_understanding.run_source_backed_workflow \
            --project ticketsla_d \
            --product-root "$GITHUB_WORKSPACE" \
            --workspace-root /tmp/qualibug-submit-e2e/workspace \
            --manifest benchmark_evaluator/enterprise_understanding/fixtures/ticketsla_d/source_manifest.json \
            --ground-truth benchmark_evaluator/enterprise_understanding/fixtures/ticketsla_d/ground_truth.json \
            --output /tmp/qualibug-submit-e2e/output \
            | tee /tmp/qualibug-submit-e2e/workflow.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/qualibug-submit-e2e/workflow.json').read_text())
          assert result['status'] == 'PASS', result
          assert result['product_phase_exit_code'] == 0, result
          assert result['hidden_ground_truth_entered_product_runtime'] is False, result
          assert result['source_identity_validated_before_ground_truth_load'] is True, result
          print('TicketSLA E2E PASS; next repair target:', result.get('next_repair_target'))
          PY

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QualiBug Automation'
          git config user.email 'automation@qualibug.local'
          git add \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_comprehension_extractor_v1.py \
            ai_test_asset_center/enterprise_knowledge_center/_chinese_business_conflicts.py \
            ai_test_asset_center/enterprise_knowledge_center/_parsing.py \
            ai_test_asset_center/enterprise_knowledge_center/composition.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/authorization_semantics.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/behavior_ir.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/builder_legacy_v1.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/explicit_fact_semantic_normalization.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_clusters.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/identity_edges.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/implementation_binding.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/lifecycle_builder.py \
            ai_test_asset_center/enterprise_knowledge_center/enterprise_understanding/structured_fact_compiler.py \
            benchmark_evaluator/enterprise_understanding/build_product_snapshot.py \
            benchmark_evaluator/enterprise_understanding/fact_slot_document.py \
            benchmark_evaluator/enterprise_understanding/root_cause.py \
            benchmark_evaluator/enterprise_understanding/ticketsla_object_baseline.py \
            tests/test_behavior_implementation_binding.py \
            tests/test_chinese_business_comprehension.py \
            tests/test_chinese_business_fact_conflicts.py \
            tests/test_enterprise_identity_resolution.py \
            tests/test_enterprise_understanding_benchmark.py \
            tests/test_enterprise_understanding_source_backed_workflow.py \
            tests/test_enterprise_understanding_structure_first_facts.py \
            tests/test_source_backed_condition_state_semantics.py \
            tests/test_source_declared_operation_identity.py \
            tests/test_source_declared_role_identity.py \
            tests/test_technical_source_understanding_attachment.py \
            tests/test_term_alias_identity_pipeline.py
          git commit -m 'fix(understanding): preserve source identities through behavior compilation' \
            -m 'Root-cause fixes across source identity, Markdown table structure, term/role/object resolution, OpenAPI operation identity, lifecycle conditions, conflict recalculation, authorization semantics, and safe complementary behavior composition. Adds source-backed regressions and keeps evaluation truth isolated from product runtime.'

      - name: Fast-forward push to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
