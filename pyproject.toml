[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qualibug-ai"
version = "95.0.0"
description = "Enterprise Business-Quality Assurance Platform — AI-powered bug discovery across any industry"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
llm = []
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
pdf = ["pypdf>=4.0"]
browser = ["playwright>=1.40"]

[project.scripts]
qualibug = "aitestops.cli:main"

[tool.setuptools.packages.find]
include = ["aitestops*", "ai_test_asset_center*", "benchmark_evaluator*", "demo_system*", "enterprise_bug_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# basetemp is pinned to a repo-local dir by conftest.py (pytest_configure) to
# avoid Windows OS-temp concurrency races with the deep nested build fixtures.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
