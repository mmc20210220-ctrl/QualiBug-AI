[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualibug-ai"
version = "95.0.0"
description = "Enterprise business-quality assurance platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
    "click>=8.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-docx>=0.8.11",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.0",
    "pytest-metadata>=3.1.0",
]
llm = ["anthropic>=0.18.0", "openai>=1.0.0"]
pdf = ["pypdf>=4.0.0", "python-docx>=0.8.11"]
browser = ["playwright>=1.40.0"]
all = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.0",
    "pytest-metadata>=3.1.0",
]

[project.scripts]
qualibug = "aitestops.cli:main"
qualibug-server = "ai_test_asset_center.private_pilot_service:run_server"

[tool.setuptools.packages.find]
include = ["aitestops*", "ai_test_asset_center*", "benchmark_evaluator*", "demo_system*", "enterprise_bug_factory*", "backend*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
