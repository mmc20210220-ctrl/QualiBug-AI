[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualibug-ai"
version = "95.0.0"
description = "Enterprise business-quality assurance platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0,<4.0.0",
    "click>=8.0.0,<9.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "olefile>=0.47,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pillow>=10.0.0,<12.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "pypdfium2>=4.30.0,<6.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "python-docx>=0.8.11,<2.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0.0",
    "requests>=2.28.0,<3.0.0",
    "rich>=13.0.0,<14.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "zstandard>=0.22.0,<1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.0",
    "pytest-metadata>=3.1.0",
]
llm = ["anthropic>=0.18.0", "openai>=1.0.0"]
pdf = ["pypdf>=4.0.0", "python-docx>=0.8.11"]
ocr = ["pytesseract>=0.3.13,<1.0.0"]
render = ["pypdfium2>=4.30.0,<6.0.0"]
browser = ["playwright>=1.40.0"]
api_fuzz = ["schemathesis>=4.20.3,<5"]
database = [
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pymysql>=1.1.0,<2.0.0",
]
all = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "pypdfium2>=4.30.0,<6.0.0",
    "playwright>=1.40.0",
    "schemathesis>=4.20.3,<5",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.0",
    "pytest-metadata>=3.1.0",
]

[project.scripts]
qualibug = "aitestops.cli:main"
qualibug-server = "ai_test_asset_center.private_pilot_entrypoint:run_server"
qualibug-doctor = "ai_test_asset_center.private_pilot_doctor:main"
qualibug-acceptance-smoke = "ai_test_asset_center.private_pilot_acceptance_smoke:main"
qualibug-discover-chain = "ai_test_asset_center.real_project_discovery_with_chain:main"
qualibug-pilot-chain = "ai_test_asset_center.enterprise_pilot_runtime_with_chain:_cli"
qualibug-identity-benchmark = "ai_test_asset_center.identity_benchmark_cli:main"
qualibug-authorization-inventory = "ai_test_asset_center.historical_authorization_inventory:main"
qualibug-authorization-rerun-plan = "ai_test_asset_center.historical_authorization_rerun_plan:main"
qualibug-authorization-rerun-consume = "ai_test_asset_center.historical_authorization_rerun_consumer:main"
qualibug-feishu-tenant-acceptance = "ai_test_asset_center.feishu_tenant_acceptance:main"
qualibug-connector-tenant-acceptance = "ai_test_asset_center.connector_tenant_acceptance:main"
qualibug-local-runner = "ai_test_asset_center.local_runner_connector:main"

[tool.setuptools.packages.find]
include = ["aitestops*", "ai_test_asset_center*"]

# Non-Python data files are NOT picked up by packages.find. Without this, a wheel or
# sdist omits the semantic lexicon entirely, so `pip install .` -- which is what both
# Dockerfiles do -- would run with an empty lexicon and the whole policy-driven
# comprehension layer silently inert, exactly as it was before the file existed.
# policies/ has no __init__.py on purpose: it is data inside a package, not a package.
[tool.setuptools.package-data]
ai_test_asset_center = [
    # The canonical semantic lexicon and its sibling policy files. Previously this
    # listed enterprise_knowledge_center/policies/ instead, which is where a second,
    # diverging copy of the lexicon lived; the two are now unified under policies/.
    "policies/*.json",
    "enterprise_knowledge_center/policies/*.json",
    "*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
